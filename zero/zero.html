<!doctype html>
<html lang="en">
	<head>
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no" />
		<title>hello.universe</title>
		<style>
			:root {
				--line: blue;
			}
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				user-select: none;
				-webkit-user-select: none;
				-webkit-user-drag: none;
				-webkit-touch-callout: none;
				-webkit-tap-highlight-color: transparent;
			}
			[hidden] {
				display: none !important;
			}
			html,
			body {
				overflow: hidden;
			}
			body {
				position: relative;
				height: 100dvh;
				background: #000;
				color: #fff;
				border: 1px solid var(--line);
				border-radius: 5px;
				font-family: sans-serif;
			}
			#universe {
				position: absolute;
				inset: 0;
				overflow: hidden;
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				grid-template-rows: repeat(2, minmax(0, 1fr));
				gap: 1px;
				background: var(--line);
				container: universe / size;
				touch-action: none;
				overscroll-behavior: none;
			}
			#universe:empty {
				background: transparent;
			}
			.space {
				display: flex;
				overflow: hidden;
				padding: clamp(0.25rem, 1vmin, 0.75rem);
				background: #000;
				container-type: size;
			}
			.space > div {
				flex: 1 1 auto;
				min-width: 0;
				min-height: 0;
			}
			#zero {
				grid-area: zero;
			}
			#one {
				grid-area: one;
			}
			#two {
				grid-area: two;
			}
			#universe[data-layout='0'] .space {
				display: none;
				grid-area: 1 / 1 / -1 / -1;
			}
			#universe[data-layout='1'] #two {
				display: none;
			}
			#universe[data-layout='0'][data-focused='0'] #zero,
			#universe[data-layout='0'][data-focused='1'] #one,
			#universe[data-layout='0'][data-focused='2'] #two {
				display: flex;
			}
			#universe[data-layout='1'][data-variant='0'] {
				grid-template-areas: 'zero one' 'zero one';
			}
			#universe[data-layout='1'][data-variant='1'] {
				grid-template-areas: 'zero zero' 'one one';
			}
			#universe[data-layout='2'][data-variant='0'] {
				grid-template-areas: 'zero one' 'zero two';
			}
			#universe[data-layout='2'][data-variant='1'] {
				grid-template-areas: 'zero zero' 'two one';
			}
			#universe[data-layout='2'][data-variant='2'] {
				grid-template-areas: 'two zero' 'one zero';
			}
			#universe[data-layout='2'][data-variant='3'] {
				grid-template-areas: 'one two' 'zero zero';
			}
		</style>
		<script>
			const circuit = '{{.CIRCUIT}}'.replace(
				'localhost',
				location.hostname,
			);
			class Pathless {
				#cache = new Map();

				static #td = new TextDecoder();
				static #range = document.createRange();

				static decode(bytes) {
					let offset = 0;

					const uvarint = () => {
						let value = 0;
						let shift = 0;
						let byte;

						do {
							byte = bytes[offset++];
							value += (byte & 0x7f) * 2 ** shift;
							shift += 7;
						} while (byte & 0x80);
						return value >>> 0;
					};

					const field = () => {
						const length = uvarint();
						const start = offset;
						offset += length;
						return bytes.subarray(start, offset);
					};

					const text = () => Pathless.#td.decode(field());
					const ones = () =>
						Array.from({ length: uvarint() }, () => ({
							name: text(),
							type: text(),
							data: field(),
							ones: ones(),
						}));
					return ones();
				}

				source(path) {
					const cached = this.#cache.get(path);
					if (cached) return cached;
					const request = fetch(`${circuit}/${path}`)
						.then((response) => response.arrayBuffer())
						.then((buffer) =>
							Pathless.decode(new Uint8Array(buffer)),
						)
						.catch((error) => {
							this.#cache.delete(path);
							throw error;
						});
					this.#cache.set(path, request);
					return request;
				}

				url(entry) {
					let value = this.#cache.get(entry);
					if (!value) {
						value = URL.createObjectURL(
							new Blob([entry.data], { type: entry.type }),
						);
						this.#cache.set(entry, value);
					}
					return value;
				}

				exec(el, data) {
					el.replaceChildren(
						Pathless.#range.createContextualFragment(
							Pathless.#td.decode(data),
						),
					);
				}

				async init() {
					const [root, frames] = await this.source('');
					this.frames = frames.ones.map(({ data }) => data);
					this.exec(document.getElementById('universe'), root.data);
					this.universe = new Universe();
					this.input = this.universe.input;
					this.universe.sync();
				}
			}
			document.addEventListener('DOMContentLoaded', async () => {
				const pathless = (window.pathless = new Pathless());
				await pathless.init();
			});
		</script>
	</head>
	<body>
		<div
			id="universe"
			data-layout="0"
			data-variant="0"
			data-focused="0"></div>
	</body>
</html>
