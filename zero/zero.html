<!doctype html>
<html lang="en">
	<head>
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no" />
		<title>hello.universe</title>
		<style>
			:root {
				--line: blue;
				--panel-height: 15dvh;
			}
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				user-select: none;
				-webkit-user-select: none;
				-webkit-user-drag: none;
				-webkit-touch-callout: none;
				-webkit-tap-highlight-color: transparent;
			}
			[hidden] {
				display: none !important;
			}
			html,
			body {
				overflow: hidden;
			}
			body {
				position: relative;
				height: 100dvh;
				background: #000;
				color: #fff;
				border: 1px solid var(--line);
				border-radius: 5px;
				font-family: sans-serif;
			}
		</style>
		<script>
			const circuit = '{{.CIRCUIT}}'.replace(
				'localhost',
				location.hostname,
			);
			class Pathless {
				#cache = new Map();
				static #decoder = new TextDecoder();
				static #range = new Range();

				static decode(bytes) {
					let offset = 0;
					const uvarint = () => {
						let value = 0;
						for (let shift = 0; ; shift += 7) {
							const byte = bytes[offset++];
							value += (byte & 0x7f) * 2 ** shift;
							if (!(byte & 0x80)) return value >>> 0;
						}
					};
					const field = () => {
						const length = uvarint();
						const start = offset;
						offset += length;
						return bytes.subarray(start, offset);
					};
					const ones = () =>
						Array.from({ length: uvarint() }, () => ({
							name: Pathless.#decoder.decode(field()),
							type: Pathless.#decoder.decode(field()),
							data: field(),
							ones: ones(),
						}));
					return ones();
				}

				source(path, blobs = false) {
					let request = this.#cache.get(path);
					if (!request) {
						request = fetch(`${circuit}/${path}`)
							.then((response) => response.bytes())
							.then(Pathless.decode)
							.catch((error) => {
								this.#cache.delete(path);
								throw error;
							});
						this.#cache.set(path, request);
					}
					if (!blobs) return request;
					return request.then((ones) =>
						ones.map((one) => {
							const url =
								this.#cache.get(one) ??
								URL.createObjectURL(
									new Blob([one.data], { type: one.type }),
								);
							this.#cache.set(one, url);
							return url;
						}),
					);
				}

				exec(el, data) {
					el.replaceChildren(
						Pathless.#range.createContextualFragment(
							Pathless.#decoder.decode(data),
						),
					);
				}

				async init() {
					const [zero, frames, panels] = await this.source('');
					this.frames = frames.ones.map(({ data }) => data);
					this.panels = panels.ones.map(({ data }) => data);
					if (!this.frames.length) return;
					this.exec(document.getElementById('universe'), zero.data);
					this.universe = new Universe(this);
					this.universe.sync();
				}
			}
			document.addEventListener('DOMContentLoaded', () =>
				(window.pathless = new Pathless()).init(),
			);
		</script>
	</head>
	<body>
		<style>
			#universe {
				position: absolute;
				inset: 0;
				overflow: hidden;
				display: flex;
				gap: 1px;
				background: var(--line);
				container: universe / size;
				touch-action: none;
				overscroll-behavior: none;
			}
			#universe:empty {
				background: transparent;
			}
			#universe:has(> #panel:not([hidden])) {
				padding-bottom: var(--panel-height);
			}
			.space {
				display: flex;
				flex: 1 1 0;
				min-width: 0;
				min-height: 0;
				overflow: hidden;
				padding: clamp(0.25rem, 1vmin, 0.75rem);
				background: #000;
				container-type: size;
			}
			.space > div {
				flex: 1 1 auto;
				min-width: 0;
				min-height: 0;
			}
			#zero {
				grid-area: zero;
			}
			#one {
				grid-area: one;
			}
			#two {
				grid-area: two;
			}
			#panel {
				position: absolute;
				inset: auto 0 0;
				height: var(--panel-height);
				z-index: 1;
				border-top: 1px solid var(--line);
				touch-action: none;
			}
			#universe[data-layout='0'] > :not(#panel) {
				display: none;
			}
			#universe[data-layout='1']:not([data-focused='2']) #two,
			#universe[data-layout='1'][data-focused='2'] #one {
				display: none;
			}
			#universe[data-layout='0'][data-focused='0'] #zero,
			#universe[data-layout='0'][data-focused='1'] #one,
			#universe[data-layout='0'][data-focused='2'] #two {
				display: flex;
			}
			#universe[data-layout='1'][data-variant='1'] {
				flex-direction: column;
			}
			#universe[data-layout='2'] {
				display: grid;
				grid-template:
					repeat(2, minmax(0, 1fr)) /
					repeat(2, minmax(0, 1fr));
			}
			#universe[data-layout='2'][data-variant='0'] {
				grid-template-areas: 'zero one' 'zero two';
			}
			#universe[data-layout='2'][data-variant='1'] {
				grid-template-areas: 'zero zero' 'two one';
			}
			#universe[data-layout='2'][data-variant='2'] {
				grid-template-areas: 'two zero' 'one zero';
			}
			#universe[data-layout='2'][data-variant='3'] {
				grid-template-areas: 'one two' 'zero zero';
			}
		</style>
		<div
			id="universe"
			data-layout="0"
			data-variant="0"
			data-focused="0"></div>
	</body>
</html>
