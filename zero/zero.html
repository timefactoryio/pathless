<!doctype html>
<html lang="en">
	<head>
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no" />
		<title>hello.universe</title>
		<style>
			:root {
				--b: 1px solid blue;
			}
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				user-select: none;
				-webkit-user-select: none;
			}
			[hidden] {
				display: none !important;
			}
			html,
			body {
				overflow: hidden;
			}

			body {
				position: relative;
				height: 100dvh;
				background: #000;
				color: #fff;
				border: var(--b);
				border-radius: 5px;
				font-family: sans-serif;
			}

			#universe {
				position: absolute;
				inset: 0;
				overflow: hidden;
				container: universe / size;
				touch-action: none;
				overscroll-behavior: none;
			}
			.space {
				position: absolute;
				left: calc((var(--left) + 1) * 50cqw);
				top: calc((1 - var(--top)) * 50cqh);
				width: calc((var(--right) - var(--left)) * 50cqw);
				height: calc((var(--top) - var(--bottom)) * 50cqh);
				display: flex;
				overflow: hidden;
				container-type: size;
			}
			.space > :first-child {
				flex: 1 1 auto;
				min-width: 0;
				min-height: 0;
			}
		</style>
		<script>
			window.circuit = '{{.CIRCUIT}}'.replace(
				'localhost',
				location.hostname,
			);
			class Pathless {
				static #td = new TextDecoder();
				static #range = document.createRange();

				static decode(bytes) {
					let offset = 0;

					const uvarint = () => {
						let value = 0;
						let shift = 0;
						let byte;
						do {
							byte = bytes[offset++];
							value |= (byte & 0x7f) << shift;
							shift += 7;
						} while (byte & 0x80);

						return value >>> 0;
					};

					const field = () => {
						const length = uvarint();
						const start = offset;
						offset += length;
						return bytes.subarray(start, offset);
					};

					const text = () => Pathless.#td.decode(field());
					const readers = [
						field,
						() =>
							Array.from({ length: uvarint() }, () => ({
								name: text(),
								type: text(),
								data: field(),
							})),
					];

					return Array.from({ length: uvarint() }, () =>
						readers[bytes[offset++]](),
					);
				}

				constructor() {
					this.cache = new Map();
					this.init();
				}

				source(path) {
					let request = this.cache.get(path);
					if (request) return request;
					request = fetch(`${window.circuit}/${path}`)
						.then(async (response) => {
							const buffer = await response.arrayBuffer();
							return Pathless.decode(new Uint8Array(buffer));
						})
						.catch((error) => {
							this.cache.delete(path);
							throw error;
						});
					this.cache.set(path, request);
					return request;
				}

				exec(el, data) {
					el.replaceChildren(
						Pathless.#range.createContextualFragment(
							Pathless.#td.decode(data),
						),
					);
				}

				async init() {
					const [one, frames, panels] = await this.source('');
					this.frames = frames.map(({ data }) => data);
					this.panels = panels.map(({ data }) => data);
					this.exec(document.getElementById('universe'), one);
				}
			}
			document.addEventListener('DOMContentLoaded', () => {
				window.pathless = new Pathless();
			});
		</script>
	</head>
	<body>
		<div id="universe"></div>
	</body>
</html>
