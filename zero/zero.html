<!doctype html>
<html lang="en">
	<head>
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no" />
		<title>hello.universe</title>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			[hidden] {
				display: none !important;
			}
			html {
				overflow: hidden;
				background: #000;
				color: #fff;
				font-family: sans-serif;
			}
			#universe {
				position: fixed;
				inset: 0;
				display: grid;
				grid-auto-columns: minmax(0, 1fr);
				grid-template: 'zero' minmax(0, 1fr);
				border-radius: 1cqmin;
				outline: 1px solid blue;
				outline-offset: -1px;
				overflow: hidden;
				container: universe / size;
				user-select: none;
				-webkit-user-select: none;
				-webkit-user-drag: none;
				-webkit-touch-callout: none;
				-webkit-tap-highlight-color: transparent;
				touch-action: none;
				overscroll-behavior: none;
			}
			.space {
				display: flex;
				padding: 1cqmin;
				overflow: hidden;
				container-type: size;
				&#zero {
					grid-area: zero;
				}
				&#one {
					grid-area: one;
				}
				&#two {
					grid-area: two;
				}
				&#three {
					grid-column: 1 / -1;
					grid-row: -1;
					block-size: 15cqh;
				}
				& > :first-child {
					flex: 1;
					min-width: 0;
					min-height: 0;
				}
			}
			#universe[data-layout='0'] {
				& > .space:not(#three) {
					grid-area: zero;
				}
				&:not(:has(> .space:not(#three):not([hidden]))) {
					& > #three {
						grid-area: zero;
						block-size: auto;
					}
				}
			}
			#universe[data-layout='1'] {
				grid-template-areas: 'zero' 'one';
				grid-template-rows: repeat(2, minmax(0, 1fr));
				&[data-variant='1'] {
					grid-template-areas: 'zero one';
					grid-template-rows: minmax(0, 1fr);
				}
			}
			#universe[data-layout='2'] {
				grid-template-rows: repeat(2, minmax(0, 1fr));
				&[data-variant='0'] {
					grid-template-areas: 'zero zero' 'two one';
				}
				&[data-variant='1'] {
					grid-template-areas: 'zero one' 'zero two';
				}
				&[data-variant='2'] {
					grid-template-areas: 'two zero' 'one zero';
				}
				&[data-variant='3'] {
					grid-template-areas: 'one two' 'zero zero';
				}
			}
		</style>
		<script>
			const circuit = '{{.CIRCUIT}}'.replace(
				'localhost',
				location.hostname,
			);
			{{.PATHLESS}}
			{{.UNIVERSE}}
			{{.INPUT}}

			document.addEventListener('DOMContentLoaded', () => {
				window.pathless = new Pathless();
				pathless.init();
			});
		</script>
	</head>
	<body>
		<div id="universe" data-layout="0" data-variant="0">
			<div id="zero" class="space"></div>
			<div id="one" class="space" hidden></div>
			<div id="two" class="space" hidden></div>
			<div id="three" class="space" hidden></div>
		</div>
	</body>
</html>
