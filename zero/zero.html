<!doctype html>
<html lang="en">
	<head>
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no" />
		<title>hello.universe</title>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			[hidden] {
				display: none !important;
			}
			html {
				overflow: hidden;
				background: #000;
				color: #fff;
				font-family: sans-serif;
			}
			#universe {
				position: fixed;
				inset: 0;
				display: grid;
				grid-auto-columns: minmax(0, 1fr);
				grid-template: 'zero' minmax(0, 1fr);
				border-radius: 1cqmin;
				outline: 1px solid blue;
				outline-offset: -1px;
				overflow: hidden;
				container: universe / size;
				user-select: none;
				-webkit-user-select: none;
				-webkit-user-drag: none;
				-webkit-touch-callout: none;
				-webkit-tap-highlight-color: transparent;
				touch-action: none;
				overscroll-behavior: none;
			}
			.space {
				display: flex;
				padding: 1cqmin;
				overflow: hidden;
				container-type: size;
				&#zero {
					grid-area: zero;
				}
				&#one {
					grid-area: one;
				}
				&#two {
					grid-area: two;
				}
				&#three {
					grid-column: 1 / -1;
					grid-row: -1;
					block-size: 15cqh;
				}
				& > :first-child {
					flex: 1;
					min-width: 0;
					min-height: 0;
				}
			}
			#universe[data-layout='0'] {
				& > .space:not(#three) {
					grid-area: zero;
				}
				&:not(:has(> .space:not(#three):not([hidden]))) {
					& > #three {
						grid-area: zero;
						block-size: auto;
					}
				}
			}
			#universe[data-layout='1'] {
				grid-template-areas: 'zero one';
				&[data-variant='1'] {
					grid-template-areas: 'zero' 'one';
					grid-template-rows: repeat(2, minmax(0, 1fr));
				}
			}
			#universe[data-layout='2'] {
				grid-template-rows: repeat(2, minmax(0, 1fr));
				&[data-variant='0'] {
					grid-template-areas: 'zero one' 'zero two';
				}
				&[data-variant='1'] {
					grid-template-areas: 'zero zero' 'two one';
				}
				&[data-variant='2'] {
					grid-template-areas: 'two zero' 'one zero';
				}
				&[data-variant='3'] {
					grid-template-areas: 'one two' 'zero zero';
				}
			}
		</style>
		<script>
			const circuit = '{{.CIRCUIT}}'.replace(
				'localhost',
				location.hostname,
			);
			class Pathless {
				#cache = new Map();
				static #decoder = new TextDecoder();
				static #range = new Range();

				constructor() {
					this.el = document.getElementById('universe');
					this.#measure();
					new ResizeObserver(() => this.#measure()).observe(this.el);
				}

				#measure() {
					const { width, height } = this.el.getBoundingClientRect();
					Object.assign(this.el, { width, height });
				}

				static decode(bytes) {
					let offset = 0;
					const uvarint = () => {
						let value = 0;
						for (let shift = 0; ; shift += 7) {
							const byte = bytes[offset++];
							value += (byte & 0x7f) * 2 ** shift;
							if (!(byte & 0x80)) return value >>> 0;
						}
					};
					const field = () => {
						const length = uvarint();
						const start = offset;
						offset += length;
						return bytes.subarray(start, offset);
					};
					const ones = () =>
						Array.from({ length: uvarint() }, () => {
							const name = Pathless.#decoder.decode(field());
							const type = Pathless.#decoder.decode(field());
							const data = field();
							return {
								name,
								type,
								data: type.startsWith('text/html')
									? Pathless.#decoder.decode(data)
									: data,
								ones: ones(),
							};
						});
					return ones();
				}

				source(path, blobs = false) {
					let request = this.#cache.get(path);
					if (!request) {
						request = fetch(`${circuit}/${path}`)
							.then((response) => response.bytes())
							.then(Pathless.decode)
							.catch((error) => {
								this.#cache.delete(path);
								throw error;
							});
						this.#cache.set(path, request);
					}
					if (!blobs) return request;
					return request.then((ones) =>
						ones.map((one) => {
							let url = this.#cache.get(one);
							if (!url) {
								const blob = new Blob([one.data], {
									type: one.type,
								});
								url = URL.createObjectURL(blob);
								this.#cache.set(one, url);
							}
							return url;
						}),
					);
				}

				exec(el, data) {
					el.replaceChildren(
						Pathless.#range.createContextualFragment(data),
					);
					return this;
				}

				async init() {
					const [zero, frames, panels] = await this.source('');
					this.frames = frames.ones;
					this.panels = panels.ones;
					this.exec(this.el, zero.data);
				}
			}
			document.addEventListener('DOMContentLoaded', () => {
				window.pathless = new Pathless();
				pathless.init();
			});
		</script>
	</head>
	<body>
		<div id="universe" data-layout="0" data-variant="0"></div>
	</body>
</html>
