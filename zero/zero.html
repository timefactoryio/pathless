<!doctype html>
<html lang="en">
	<head>
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no" />
		<title>hello.universe</title>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			[hidden] {
				display: none !important;
			}
			html {
				overflow: hidden;
				background: #000;
				color: #fff;
				font-family: sans-serif;
			}
			#universe {
				position: fixed;
				inset: 0;
				display: flex;
				border-radius: 1svmin;
				outline: 1px solid blue;
				outline-offset: -1px;
				overflow: clip;
				container: universe / size;
				user-select: none;
				-webkit-user-select: none;
				-webkit-user-drag: none;
				-webkit-touch-callout: none;
				-webkit-tap-highlight-color: transparent;
				touch-action: none;
				overscroll-behavior: none;
				--panel-height: 15dvh;
				&:has(> #three:not([hidden])) {
					padding-bottom: var(--panel-height);
				}
				&.y {
					flex-direction: column;
				}
				&:is(.up, .right, .down, .left) {
					flex-flow: row wrap;
					& > :is(#zero, #one, #two) {
						flex: none;
						width: 50%;
						height: 50%;
					}
					& > #zero {
						width: 100%;
					}
					&:is(.left, .right) {
						flex-direction: column;
						& > #zero {
							width: 50%;
							height: 100%;
						}
					}
					&:is(.right, .down) > #zero {
						order: 3;
					}
				}
			}
			.space {
				display: flex;
				padding: 1cqmin;
				overflow: hidden;
				container-type: size;
				&,
				& > :first-child {
					flex: 1;
					min-width: 0;
					min-height: 0;
				}
				&#three {
					position: absolute;
					inset: auto 0 0;
					height: var(--panel-height);
				}
			}
		</style>
		<script>
			const circuit = '{{.CIRCUIT}}'.replace(
				'localhost',
				location.hostname,
			);
			{{.PATHLESS}}
			{{.INPUT}}
			document.addEventListener('DOMContentLoaded', () => {
				window.pathless = new Pathless();
				new Input();
				pathless.register(['tab'], () => pathless.focus());
				pathless.register(['q', 'swipe left'], () => pathless.navigate(-1));
				pathless.register(['e', 'swipe right'], () => pathless.navigate(1));
				pathless.register(['z', 'bottomcorner'], () => pathless.panel());
				pathless.register(['1'], () => pathless.one());
				pathless.register(['2'], () => pathless.two());
				pathless.register(['3'], () => pathless.three());
				pathless.init();
			});
		</script>
	</head>
	<body>
		<div id="universe">
			<div id="zero" class="space"></div>
			<div id="one" class="space" hidden></div>
			<div id="two" class="space" hidden></div>
			<div id="three" class="space" hidden></div>
		</div>
	</body>
</html>
