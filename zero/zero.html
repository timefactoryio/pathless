<!doctype html>
<html lang="en">
	<head>
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no" />
		<title>hello.universe</title>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				user-select: none;
				-webkit-user-select: none;
				-webkit-user-drag: none;
				-webkit-touch-callout: none;
				-webkit-tap-highlight-color: transparent;
			}
			[hidden] {
				display: none !important;
			}
			html,
			body,
			#universe,
			.space {
				overflow: hidden;
			}
			body,
			#universe {
				background: #000;
			}
			body {
				color: #fff;
				font-family: sans-serif;
			}
			#universe {
				--rows: minmax(0, 1fr);
				--panel-row: 0px;
				position: fixed;
				inset: 0;
				display: grid;
				grid-auto-columns: minmax(0, 1fr);
				grid-template-rows: var(--rows) var(--panel-row);
				grid-template-areas: 'zero' 'three';
				border-radius: 5px;
				container: universe / size;
				touch-action: none;
				overscroll-behavior: none;
			}
			#universe:not(:empty)::after {
				content: '';
				position: absolute;
				inset: 0;
				z-index: 2;
				border-radius: inherit;
				box-shadow: inset 0 0 0 1px blue;
				pointer-events: none;
			}
			#universe.panel {
				--panel-row: 15dvh;
			}
			.space,
			.space > :first-child {
				min-width: 0;
				min-height: 0;
			}
			.space {
				display: flex;
				padding: clamp(0.25rem, 1vmin, 0.75rem);
				box-shadow: inset 0 0 0 0.5px blue;
				container-type: size;
			}
			.space > :first-child {
				flex: 1;
			}
			#zero {
				grid-area: zero;
			}
			#one {
				grid-area: one;
			}
			#two {
				grid-area: two;
			}
			#three {
				grid-area: three;
			}
			#universe:not(.panel) > #three,
			#universe[data-layout='0'] > :not(#three),
			#universe[data-layout='1']:not([data-focused='2']) #two,
			#universe[data-layout='1'][data-focused='2'] #one {
				display: none;
			}
			#universe[data-layout='0'][data-focused='0'] #zero,
			#universe[data-layout='0'][data-focused='1'] #one,
			#universe[data-layout='0'][data-focused='2'] #two {
				display: flex;
				grid-area: zero;
			}
			#universe[data-layout='1'] {
				grid-template-areas: 'zero one' 'three three';
			}
			#universe[data-layout='1'][data-focused='2'] #two {
				grid-area: one;
			}
			#universe[data-layout='1'][data-variant='1'] {
				grid-template-areas: 'zero' 'one' 'three';
			}
			#universe[data-layout='1'][data-variant='1'],
			#universe[data-layout='2'] {
				--rows: repeat(2, minmax(0, 1fr));
			}
			#universe[data-layout='2'][data-variant='0'] {
				grid-template-areas: 'zero one' 'zero two' 'three three';
			}
			#universe[data-layout='2'][data-variant='1'] {
				grid-template-areas: 'zero zero' 'two one' 'three three';
			}
			#universe[data-layout='2'][data-variant='2'] {
				grid-template-areas: 'two zero' 'one zero' 'three three';
			}
			#universe[data-layout='2'][data-variant='3'] {
				grid-template-areas: 'one two' 'zero zero' 'three three';
			}
		</style>
		<script>
			const circuit = '{{.CIRCUIT}}'.replace(
				'localhost',
				location.hostname,
			);
			class Pathless {
				#cache = new Map();
				static #decoder = new TextDecoder();
				static #range = new Range();

				constructor() {
					this.el = document.getElementById('universe');
				}

				get frame() {
					return this.universe.frame;
				}

				static decode(bytes) {
					let offset = 0;
					const uvarint = () => {
						let value = 0;
						for (let shift = 0; ; shift += 7) {
							const byte = bytes[offset++];
							value += (byte & 0x7f) * 2 ** shift;
							if (!(byte & 0x80)) return value >>> 0;
						}
					};
					const field = () => {
						const length = uvarint();
						const start = offset;
						offset += length;
						return bytes.subarray(start, offset);
					};
					const ones = () => {
						const result = new Array(uvarint());
						for (let index = 0; index < result.length; index++) {
							const name = Pathless.#decoder.decode(field());
							const type = Pathless.#decoder.decode(field());
							const data = field();
							result[index] = {
								name,
								type,
								data: type.startsWith('text/html')
									? Pathless.#decoder.decode(data)
									: data,
								ones: ones(),
							};
						}
						return result;
					};
					return ones();
				}

				source(path, blobs = false) {
					let request = this.#cache.get(path);
					if (!request) {
						request = fetch(`${circuit}/${path}`)
							.then((response) => response.bytes())
							.then(Pathless.decode)
							.catch((error) => {
								this.#cache.delete(path);
								throw error;
							});
						this.#cache.set(path, request);
					}
					if (!blobs) return request;
					return request.then((ones) =>
						ones.map(
							(one) =>
								this.#cache.get(one) ??
								this.#cache
									.set(
										one,
										URL.createObjectURL(
											new Blob([one.data], {
												type: one.type,
											}),
										),
									)
									.get(one),
						),
					);
				}

				exec(el, data) {
					el.replaceChildren(
						Pathless.#range.createContextualFragment(data),
					);
				}

				async init() {
					const [zero, frames, panels] = await this.source('');
					this.frames = frames.ones;
					this.panels = panels.ones;
					this.exec(this.el, zero.data);

					const { universe } = this;
					this.x = universe.pointer.x;
					this.y = universe.pointer.y;
					for (const name of [
						'navigate',
						'layout',
						'focus',
						'togglePanel',
						'sync',
					]) {
						this[name] = universe[name].bind(universe);
					}
					if (this.frames.length) this.sync();
				}
			}
			document.addEventListener('DOMContentLoaded', async () => {
				window.pathless = new Pathless();
				await pathless.init();
			});
		</script>
	</head>
	<body>
		<div
			id="universe"
			data-layout="0"
			data-variant="0"
			data-focused="0"></div>
	</body>
</html>
