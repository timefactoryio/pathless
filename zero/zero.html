<!doctype html>
<html lang="en">
	<head>
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no" />
		<title>hello.universe</title>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			[hidden] {
				display: none !important;
			}
			html {
				overflow: hidden;
				background: #000;
				color: #fff;
				font-family: sans-serif;
			}
			#universe {
				position: fixed;
				inset: 0;
				display: flex;
				border-radius: 1svmin;
				outline: 1px solid blue;
				outline-offset: -1px;
				overflow: clip;
				container: universe / size;
				user-select: none;
				-webkit-user-select: none;
				-webkit-user-drag: none;
				-webkit-touch-callout: none;
				-webkit-tap-highlight-color: transparent;
				touch-action: none;
				overscroll-behavior: none;
			}
			.space,
			.panel {
				display: flex;
				min-width: 0;
				min-height: 0;
				padding: 1cqmin;
				overflow: hidden;
				container-type: size;
				& > :first-child {
					flex: 1;
					min-width: 0;
					min-height: 0;
				}
			}
			.space {
				flex: 1;
			}
		</style>
		<script>
			const circuit = '{{.CIRCUIT}}'.replace(
				'localhost',
				location.hostname,
			);
			{{.PATHLESS}}
			{{.INPUT}}

			document.addEventListener('DOMContentLoaded', () => {
				window.pathless = new Pathless();
				pathless.init();
			});
		</script>
	</head>
	<body>
		<div id="universe">
			<div id="zero" class="space"></div>
			<div id="one" class="space" hidden></div>
			<div id="two" class="space" hidden></div>
			<div id="three" class="panel" hidden></div>
		</div>
	</body>
</html>
