<!doctype html>
<html lang="en">
	<head>
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no" />
		<title>hello.universe</title>
		<style>
			:root {
				--b: 1px solid blue;
			}
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				user-select: none;
				-webkit-user-select: none;
			}
			[hidden] {
				display: none !important;
			}
			html,
			body {
				overflow: hidden;
			}

			body {
				position: relative;
				height: 100dvh;
				background: #000;
				color: #fff;
				border: var(--b);
				border-radius: 5px;
				font-family: sans-serif;
			}

			#universe {
				position: absolute;
				inset: 0;
				overflow: hidden;
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				grid-template-rows: repeat(2, minmax(0, 1fr));
				container: universe / size;
				touch-action: pan-y;
				overscroll-behavior: none;
			}
			.space {
				display: flex;
				overflow: hidden;
				container-type: size;
			}
			#zero {
				grid-area: zero;
			}
			#one {
				grid-area: one;
			}
			#two {
				grid-area: two;
			}
			#universe[data-layout='0'] .space,
			#universe[data-layout='1'] #two {
				display: none;
			}
			#universe[data-layout='0'][data-focused='0'] #zero,
			#universe[data-layout='0'][data-focused='1'] #one,
			#universe[data-layout='0'][data-focused='2'] #two {
				display: flex;
			}
			#universe[data-layout='0'][data-focused='0'] {
				grid-template-areas: 'zero zero' 'zero zero';
			}
			#universe[data-layout='0'][data-focused='1'] {
				grid-template-areas: 'one one' 'one one';
			}
			#universe[data-layout='0'][data-focused='2'] {
				grid-template-areas: 'two two' 'two two';
			}
			#universe[data-layout='1'][data-variant='0'] {
				grid-template-areas: 'zero one' 'zero one';
			}
			#universe[data-layout='1'][data-variant='1'] {
				grid-template-areas: 'zero zero' 'one one';
			}
			#universe[data-layout='2'][data-variant='0'] {
				grid-template-areas: 'zero one' 'zero two';
			}
			#universe[data-layout='2'][data-variant='1'] {
				grid-template-areas: 'zero zero' 'two one';
			}
			#universe[data-layout='2'][data-variant='2'] {
				grid-template-areas: 'two zero' 'one zero';
			}
			#universe[data-layout='2'][data-variant='3'] {
				grid-template-areas: 'one two' 'zero zero';
			}
			#universe[data-layout='1'][data-variant='0'] #one,
			#universe[data-layout='2'][data-variant='0'] :is(#one, #two) {
				border-left: var(--b);
			}
			#universe[data-layout='1'][data-variant='1'] #one,
			#universe[data-layout='2'][data-variant='1'] :is(#one, #two) {
				border-top: var(--b);
			}
			#universe[data-layout='2'][data-variant='0'] #two,
			#universe[data-layout='2'][data-variant='2'] #one {
				border-top: var(--b);
			}
			#universe[data-layout='2'][data-variant='1'] #one,
			#universe[data-layout='2'][data-variant='3'] #two {
				border-left: var(--b);
			}
			#universe[data-layout='2'][data-variant='2'] :is(#one, #two) {
				border-right: var(--b);
			}
			#universe[data-layout='2'][data-variant='3'] :is(#one, #two) {
				border-bottom: var(--b);
			}
			.space > div:first-of-type {
				flex: 1 1 auto;
				min-width: 0;
				min-height: 0;
			}
			.space img {
				pointer-events: none;
				-webkit-user-drag: none;
			}
		</style>
		<script>
			window.circuit = '{{.CIRCUIT}}'.replace(
				'localhost',
				location.hostname,
			);
			class Pathless {
				static #td = new TextDecoder();
				static #range = document.createRange();

				static decode(bytes) {
					let offset = 0;

					const uvarint = () => {
						let value = 0;
						let shift = 0;
						let byte;

						do {
							byte = bytes[offset++];
							value += (byte & 0x7f) * 2 ** shift;
							shift += 7;
						} while (byte & 0x80);

						return value >>> 0;
					};

					const field = () => {
						const length = uvarint();
						const start = offset;
						offset += length;
						return bytes.subarray(start, offset);
					};

					const text = () => Pathless.#td.decode(field());
					const ones = () =>
						Array.from({ length: uvarint() }, () => ({
							name: text(),
							type: text(),
							data: field(),
							ones: ones(),
						}));
					return ones();
				}

				constructor() {
					this.cache = new Map();
					this.init();
				}

				source(path) {
					let request = this.cache.get(path);
					if (request) return request;
					request = fetch(`${window.circuit}/${path}`)
						.then(async (response) => {
							const buffer = await response.arrayBuffer();
							return Pathless.decode(new Uint8Array(buffer));
						})
						.catch((error) => {
							this.cache.delete(path);
							throw error;
						});
					this.cache.set(path, request);
					return request;
				}

				url(entry) {
					let value = this.cache.get(entry);
					if (!value) {
						value = URL.createObjectURL(
							new Blob([entry.data], { type: entry.type }),
						);
						this.cache.set(entry, value);
					}
					return value;
				}

				exec(el, data) {
					el.replaceChildren(
						Pathless.#range.createContextualFragment(
							Pathless.#td.decode(data),
						),
					);
				}

				async init() {
					const [root, frames, panels] = await this.source('');
					this.frames = frames.ones.map(({ data }) => data);
					this.panels = panels.ones.map(({ data }) => data);
					this.exec(document.getElementById('universe'), root.data);
				}
			}
			document.addEventListener('DOMContentLoaded', () => {
				window.pathless = new Pathless();
			});
		</script>
	</head>
	<body>
		<div
			id="universe"
			data-layout="0"
			data-variant="0"
			data-focused="0"></div>
	</body>
</html>
