<!doctype html>
<html lang="en">
	<head>
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no" />
		<title>hello.universe</title>
		<style>
			:root {
				--b: 1px solid blue;
			}
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				user-select: none;
				-webkit-user-select: none;
			}
			[hidden] {
				display: none !important;
			}
			body {
				height: 100dvh;
				overflow: hidden;
				font-family: sans-serif;
				background: #000;
				color: #fff;
				display: flex;
				flex-direction: column;
				border: var(--b);
				border-radius: 5px;
			}
			body,
			:is(#zero, #one, #two),
			#panel {
				touch-action: none;
				overscroll-behavior: none;
			}
			#universe {
				flex: 1;
				min-height: 0;
				display: flex;
			}
			:is(#zero, #one, #two) {
				flex: 1;
				overflow: hidden;
				position: relative;
				isolation: isolate;
				display: flex;
				flex-direction: column;
			}
			:is(#zero, #one, #two) > * {
				width: 100%;
			}
			:is(#zero, #one, #two) > :first-child {
				flex: 1;
				min-height: 0;
			}
			#zero {
				grid-area: zero;
				container: zero / size;
			}
			#one {
				grid-area: one;
				container: one / size;
			}
			#two {
				grid-area: two;
				container: two / size;
			}
			#universe[data-layout='1'][data-variant='1'] {
				flex-direction: column;
			}
			#universe[data-layout='2'] {
				display: grid;
				grid-template-columns: 1fr 1fr;
				grid-template-rows: 1fr 1fr;
			}
			#universe[data-layout='2'][data-variant='0'] {
				grid-template-areas: 'zero one' 'zero two';
			}
			#universe[data-layout='2'][data-variant='1'] {
				grid-template-areas: 'zero zero' 'two  one';
			}
			#universe[data-layout='2'][data-variant='2'] {
				grid-template-areas: 'two  zero' 'one   zero';
			}
			#universe[data-layout='2'][data-variant='3'] {
				grid-template-areas: 'one   two' 'zero zero';
			}
			#universe:not([data-layout='0'])[data-variant='0'] #zero {
				border-right: var(--b);
			}
			#universe:not([data-layout='0'])[data-variant='1'] #zero {
				border-bottom: var(--b);
			}
			#universe[data-layout='2'][data-variant='2'] #zero {
				border-left: var(--b);
			}
			#universe[data-layout='2'][data-variant='3'] #zero {
				border-top: var(--b);
			}
			#universe[data-layout='2'][data-variant='0'] #one {
				border-bottom: var(--b);
			}
			#universe[data-layout='2'][data-variant='1'] #one {
				border-left: var(--b);
			}
			#universe[data-layout='2'][data-variant='2'] #one {
				border-top: var(--b);
			}
			#universe[data-layout='2'][data-variant='3'] #one {
				border-right: var(--b);
			}
			#panel {
				height: 15vh;
				border-top: var(--b);
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 0.5em;
			}
		</style>
		<script>
			window.circuit = '{{.CIRCUIT}}'.replace(
				'localhost',
				location.hostname,
			);
			class Pathless {
				static #td = new TextDecoder();
				static #range = document.createRange();
				static decode(bytes) {
					let offset = 0;

					const uvarint = () => {
						let value = 0;
						let shift = 0;
						let byte;

						do {
							byte = bytes[offset++];
							value += (byte & 0x7f) * 2 ** shift;
							shift += 7;
						} while (byte & 0x80);

						return value >>> 0;
					};

					const field = () => {
						const length = uvarint();
						const start = offset;
						offset += length;
						return bytes.subarray(start, offset);
					};

					const text = () => Pathless.#td.decode(field());
					const ones = () =>
						Array.from({ length: uvarint() }, () => ({
							name: text(),
							type: text(),
							data: field(),
							ones: ones(),
						}));
					return ones();
				}

				constructor() {
					this.cache = new Map();
					this.init();
				}

				source(path) {
					let request = this.cache.get(path);
					if (request) return request;

					request = fetch(`${window.circuit}/${path}`)
						.then(async (response) => {
							const buffer = await response.arrayBuffer();
							return Pathless.decode(new Uint8Array(buffer));
						})
						.catch((error) => {
							this.cache.delete(path);
							throw error;
						});

					this.cache.set(path, request);
					return request;
				}

				url(entry) {
					let value = this.cache.get(entry);
					if (!value) {
						value = URL.createObjectURL(
							new Blob([entry.data], { type: entry.type }),
						);
						this.cache.set(entry, value);
					}
					return value;
				}

				exec(el, data) {
					el.replaceChildren(
						Pathless.#range.createContextualFragment(
							Pathless.#td.decode(data),
						),
					);
				}

				async init() {
					const [root, frames, panels] = await this.source('');
					this.frames = frames.ones.map(({ data }) => data);
					this.panels = panels.ones.map(({ data }) => data);
					this.exec(document.getElementById('universe'), root.data);
					this.universe.init();
				}
			}
			document.addEventListener('DOMContentLoaded', () => {
				window.pathless = new Pathless();
			});
		</script>
	</head>
	<body>
		<div id="universe" data-layout="0" data-variant="0"></div>
		<div id="panel" hidden></div>
	</body>
</html>
