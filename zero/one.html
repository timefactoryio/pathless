<div id="zero" class="space"></div>
<div id="one" class="space"></div>
<div id="two" class="space"></div>
<div id="panel" class="space" hidden></div>

<script>
	class Universe {
		#previous = null;
		#rendering = null;
		constructor(pathless) {
			this.pathless = pathless;
			this.el = document.getElementById('universe');
			this.spaces = ['zero', 'one', 'two'].map((id) => this.#space(id));
			this.panel = this.#space('panel');
			this.plane = new Plane(this.el);
			this.input = new Input(this);
		}

		#space(id) {
			return {
				el: document.getElementById(id),
				frame: 0,
				states: [],
			};
		}
		#render(space, frame) {
			this.#rendering = space;
			this.input.clear(space);
			try {
				this.pathless.exec(space.el, frame);
			} finally {
				this.#rendering = null;
			}
		}

		get #state() {
			const { layout, variant, focused } = this.el.dataset;
			return [layout, variant, focused].map(Number);
		}
		get space() {
			return this.#rendering ?? this.spaces[this.#state[2]];
		}
		get frame() {
			return this.space.el.querySelector(':scope > div');
		}
		get visible() {
			return this.spaces.filter(({ el }) => el.offsetParent !== null);
		}
		set view([layout, variant]) {
			this.el.dataset.layout = layout;
			this.el.dataset.variant = variant;
			this.sync();
		}

		set focused(space) {
			this.el.dataset.focused = this.spaces.indexOf(space);
		}

		state() {
			const { states, frame } = this.space;
			return (states[frame] ??= new Map());
		}

		sync(...spaces) {
			for (const space of spaces.length ? spaces : this.visible)
				this.#render(space, this.pathless.frames[space.frame]);
		}

		#cycle(index, direction, length) {
			return (((index + direction) % length) + length) % length;
		}

		navigate(direction, space = this.space) {
			space.frame = this.#cycle(
				space.frame,
				direction,
				this.pathless.frames.length,
			);
			this.sync(space);
			return space.frame;
		}

		layout(l, v) {
			const [layout, variant] = this.#state;
			l ??= layout;
			v ??= l === layout ? variant + 1 : 0;
			if (l === 0 && layout === 0) {
				if (!this.#previous) return;
				[l, v] = this.#previous;
			} else if (l === 0) {
				this.#previous = [layout, variant];
				v = 0;
			}
			if (l) this.#previous = [l, (v = this.#cycle(v, 0, 2 ** l))];
			return (this.view = [l, v]);
		}

		focus(direction = 1, space = this.space) {
			const visible = this.visible;
			if (!visible.length) return;

			const index = visible.indexOf(space);
			if (index < 0)
				return (this.focused = visible.at(direction < 0 ? -1 : 0));
			return (this.focused =
				visible[this.#cycle(index, direction, visible.length)]);
		}

		togglePanel() {
			if (!this.pathless.panels.length) return false;
			const { el } = this.panel;
			const visible = el.hidden;
			el.hidden = !visible;
			if (visible && !el.firstElementChild)
				this.#render(this.panel, this.pathless.panels[0]);
			return visible;
		}
	}

	class Input {
		#bindings = new Map();
		#universe;
		#down = null;
		#lastTap = 0;

		constructor(universe) {
			this.#universe = universe;
			this.x = this.#axis(3, 2);
			this.y = this.#axis(0, 1);
			this.z = this.#axis(4, 5);
			for (const type of ['pointerdown', 'pointercancel', 'pointerup'])
				universe.el.addEventListener(type, this);
			universe.el.addEventListener('touchend', this, { passive: false });
		}

		handleEvent(event) {
			if (event.type === 'touchend') {
				const now = Date.now();
				if (now - this.#lastTap < 300) event.preventDefault();
				this.#lastTap = now;
				return;
			}
			if (event.type === 'pointerdown') {
				if (event.isPrimary) this.#down = this.pointerdown(event);
				return;
			}
			const down = this.#down;
			this.#down = null;
			if (!down || !event.isPrimary || event.type === 'pointercancel')
				return;
			this.pointerup(down, event);
		}

		pointerdown(event) {
			return {
				start: this.#universe.plane.coordinate(event),
				target: event.target,
			};
		}

		pointerup({ start, target }, event) {
			const universe = this.#universe;
			const space = universe.visible.find(({ el }) =>
				el.contains(target),
			);
			if (!space) return;
			const { plane } = universe;
			const end = plane.coordinate(event);
			const delta = { x: end.x - start.x, y: end.y - start.y };
			if (Math.hypot(delta.x, delta.y) < 0.1)
				this.handle(
					plane.direction(plane.coordinate(event, space.el)),
					space,
				);
			else {
				const direction = plane.direction(delta);
				if (direction > 1)
					universe.navigate(direction === 2 ? 1 : -1, space);
			}
		}

		handle(direction, space = this.#universe.space) {
			if (!this.#universe.visible.includes(space)) return;
			this.#bindings.get(space)?.[direction]?.();
		}

		#axis(plusDirection, minusDirection) {
			return (plus, minus) => {
				const space = this.#universe.space;
				const bindings = this.#bindings.get(space) ?? [];
				bindings[plusDirection] = plus;
				bindings[minusDirection] = minus;
				this.#bindings.set(space, bindings);
				return this.#universe;
			};
		}

		clear(space) {
			this.#bindings.delete(space);
		}
	}

	class Plane {
		constructor(el) {
			this.el = el;
		}

		coordinate({ clientX, clientY }, el = this.el) {
			const { left, top, width, height } = el.getBoundingClientRect();
			return {
				x: ((clientX - left) * 2) / (width || 1) - 1,
				y: 1 - ((clientY - top) * 2) / (height || 1),
			};
		}

		direction({ x, y }) {
			return Math.abs(x) >= Math.abs(y)
				? 2 + Number(x >= 0)
				: Number(y < 0);
		}
	}

	class Keyboard {
		#keys = new Map();

		constructor() {
			window.addEventListener('keydown', this);
		}

		get keys() {
			return Object.fromEntries(this.#keys);
		}

		set keys(keys) {
			this.#keys = new Map(
				Object.entries(keys).map(([key, fn]) => [
					key.toLowerCase(),
					fn,
				]),
			);
		}

		handleEvent(event) {
			if (
				event.metaKey ||
				event.ctrlKey ||
				event.altKey ||
				event.shiftKey
			)
				return;

			const fn = this.#keys.get(event.key.toLowerCase());
			if (!fn) return;
			event.preventDefault();
			fn();
		}
	}
</script>
