<div id="zero" class="space"></div>
<div id="one" class="space"></div>
<div id="two" class="space"></div>
<div id="three" class="space"></div>

<script>
	class Universe {
		#previous = null;
		#rendering = null;
		#focused = null;
		#panelOpen = false;

		constructor() {
			this.el = pathless.el;
			this.spaces = ['zero', 'one', 'two', 'three'].map((id) => ({
				el: document.getElementById(id),
				frame: 0,
				states: [],
				bindings: {},
			}));
			this.#focused = this.spaces[this.el.dataset.focused];
			new Pointer(this);
			new ResizeObserver(() => this.#measure()).observe(this.el, {
				box: 'border-box',
			});
			for (const name of [
				'x',
				'y',
				'navigate',
				'layout',
				'focus',
				'togglePanel',
			]) {
				Object.defineProperty(pathless, name, {
					value: this[name].bind(this),
				});
			}
			Object.defineProperty(pathless, 'frame', {
				get: () => {
					const space = this.space;
					return {
						el: space.el.firstElementChild,
						state: (space.states[space.frame] ??= new Map()),
					};
				},
			});
			this.sync();
		}
		#measure() {
			({ width: this.width, height: this.height } =
				this.el.getBoundingClientRect());
			for (const space of this.visible) {
				const { left, top, width, height } =
					space.el.getBoundingClientRect();
				space.origin = {
					x: (left + width / 2) / (this.width / 2) - 1,
					y: 1 - (top + height / 2) / (this.height / 2),
				};
			}
		}
		#cycle(index, direction, length) {
			return (((index + direction) % length) + length) % length;
		}

		x(left, right) {
			this.space.bindings.x = [left, right];
		}

		y(up, down) {
			this.space.bindings.y = [up, down];
		}

		get space() {
			return this.#rendering ?? this.#focused;
		}

		get visible() {
			const { layout, focused } = this.el.dataset;
			return this.spaces.filter((space, index) => {
				if (index === 3) return this.#panelOpen;
				if (layout === '0') return index === Number(focused);
				return layout !== '1' || index !== (focused === '2' ? 1 : 2);
			});
		}

		set focused(space) {
			const index = this.spaces.indexOf(space);
			if (index < 0 || space === this.#focused) return;
			this.#focused = space;
			if (index < 3) this.el.dataset.focused = index;
			this.sync();
		}

		sync() {
			this.el.classList.toggle('panel', this.#panelOpen);
			const visible = this.visible;
			if (!visible.includes(this.#focused))
				this.#focused = this.spaces[this.el.dataset.focused];
			this.#measure();
			for (const space of visible)
				if (!space.el.firstElementChild) this.navigate(0, space);
		}

		navigate(direction, space = this.space) {
			const frames =
				space === this.spaces[3] ? pathless.panels : pathless.frames;
			if (!frames.length) return;
			space.frame = this.#cycle(space.frame, direction, frames.length);
			const rendering = this.#rendering;
			this.#rendering = space;
			try {
				space.bindings = {};
				pathless.exec(space.el, frames[space.frame].data);
			} finally {
				this.#rendering = rendering;
			}
		}

		layout(l, v) {
			const { dataset } = this.el;
			const layout = Number(dataset.layout);
			const variant = Number(dataset.variant);
			l ??= layout;
			v ??= l === layout ? variant + 1 : 0;
			if (l === 0 && layout === 0) {
				if (!this.#previous) return;
				[l, v] = this.#previous;
			} else if (l === 0) {
				this.#previous = [layout, variant];
				v = 0;
			}
			if (l) v = this.#cycle(v, 0, 2 ** l);
			dataset.layout = l;
			dataset.variant = v;
			this.sync();
		}

		focus(direction = 1, space = this.space) {
			const visible = this.visible;
			const index = visible.indexOf(space);
			this.focused =
				index < 0
					? visible.at(direction < 0 ? -1 : 0)
					: visible[this.#cycle(index, direction, visible.length)];
		}

		togglePanel() {
			if (!pathless.panels.length) return;
			this.#panelOpen = !this.#panelOpen;
			this.sync();
		}
	}

	class Pointer {
		state = null;

		constructor(universe) {
			this.universe = universe;
			for (const [type, handler] of [
				['pointerdown', this.down],
				['pointerup', this.up],
				['pointercancel', this.cancel],
				['lostpointercapture', this.cancel],
			]) {
				pathless.el.addEventListener(type, handler.bind(this));
			}
		}

		down(event) {
			if (!event.isPrimary || event.button !== 0 || this.state) return;
			const space = this.spaceFor(event.target);
			if (!space) return;
			if (space !== this.universe.space) this.universe.focused = space;
			pathless.el.setPointerCapture(event.pointerId);
			this.state = {
				id: event.pointerId,
				start: this.coordinate(event),
				space,
			};
		}

		up(event) {
			const pointer = this.state;
			if (!pointer || pointer.id !== event.pointerId) return;
			if (
				event.defaultPrevented ||
				!this.universe.visible.includes(pointer.space)
			)
				return this.cancel(event);
			this.state = null;
			this.output(pointer.start, this.coordinate(event), pointer.space);
		}

		cancel(event) {
			if (this.state?.id === event.pointerId) this.state = null;
		}

		spaceFor(target) {
			return this.universe.visible.find(({ el }) => el.contains(target));
		}

		coordinate(point) {
			const { width, height } = this.universe;
			return {
				x: Math.max(-1, Math.min(1, (2 * point.clientX) / width - 1)),
				y: Math.max(-1, Math.min(1, 1 - (2 * point.clientY) / height)),
			};
		}

		output(start, end, space) {
			const deltaX = Math.abs(end.x - start.x);
			const deltaY = Math.abs(end.y - start.y);
			const { bindings, origin } = space;
			if (Math.max(deltaX, deltaY) >= 0.1) {
				if (deltaX >= deltaY)
					pathless.navigate(end.x < start.x ? -1 : 1, space);
				return;
			}
			if (
				Math.max(
					Math.abs(start.x),
					Math.abs(start.y),
					Math.abs(end.x),
					Math.abs(end.y),
				) <= 0.05
			)
				return pathless.togglePanel();
			const offsetX = end.x - origin.x;
			const offsetY = end.y - origin.y;
			const callback =
				Math.abs(offsetX) >= Math.abs(offsetY)
					? bindings.x?.[offsetX < 0 ? 0 : 1]
					: bindings.y?.[offsetY < 0 ? 1 : 0];
			callback?.(start, end, space);
		}
	}
	new Universe();
</script>
