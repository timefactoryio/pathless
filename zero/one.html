<div id="zero" class="space"></div>
<div id="one" class="space"></div>
<div id="two" class="space"></div>
<div id="three" class="space"></div>

<script>
	class Universe {
		#previous = null;
		#rendering = null;
		#bindings = new WeakMap();
		constructor(frames, panels) {
			this.frames = frames;
			this.panels = panels;
			const space = (id) => ({
				el: document.getElementById(id),
				frame: 0,
				states: [],
			});
			this.spaces = ['zero', 'one', 'two'].map(space);
			this.panel = space('three');
			this.pointer = new Pointer(this);
			this.input = {
				x: (left, right) => this.bind({ left, right }),
				y: (up, down) => this.bind({ up, down }),
			};
			this.bind(
				{
					left: ({ space }) => this.navigate(1, space),
					right: ({ space }) => this.navigate(-1, space),
				},
				'swipe',
				pathless.el,
			);
			this.bind({ origin: () => this.togglePanel() }, 'tap', pathless.el);
			this.pointer.onGesture = (event) => this.route(event);
		}

		get space() {
			return this.#rendering ?? this.spaces[pathless.el.dataset.focused];
		}
		get frame() {
			const { el, states, frame } = this.space;
			return {
				el: el.firstElementChild,
				state: (states[frame] ??= new Map()),
			};
		}
		get visible() {
			const { layout, focused } = pathless.el.dataset;
			const [zero, one, two] = this.spaces;
			const visible =
				layout === '0'
					? [this.spaces[focused]]
					: layout === '1'
						? [zero, focused === '2' ? two : one]
						: this.spaces;
			return pathless.el.classList.contains('panel')
				? [...visible, this.panel]
				: visible;
		}

		set focused(space) {
			const index = this.spaces.indexOf(space);
			if (index < 0) return;
			pathless.el.dataset.focused = index;
			this.sync();
		}

		sync(...spaces) {
			if (!spaces.length)
				spaces = this.visible.filter(({ el }) => !el.firstElementChild);
			for (const space of spaces) {
				const frames = space === this.panel ? this.panels : this.frames;
				if (!frames.length) continue;
				this.#rendering = space;
				try {
					pathless.exec(space.el, frames[space.frame].data);
				} finally {
					this.#rendering = null;
				}
			}
		}

		#cycle(index, direction, length) {
			return (((index + direction) % length) + length) % length;
		}

		navigate(direction, space = this.space) {
			const frames = space === this.panel ? this.panels : this.frames;
			if (!frames.length) return;
			space.frame = this.#cycle(space.frame, direction, frames.length);
			this.sync(space);
		}

		layout(l, v) {
			const { dataset } = pathless.el;
			const layout = Number(dataset.layout);
			l ??= layout;
			v ??= l === layout ? Number(dataset.variant) + 1 : 0;
			if (l === 0) {
				if (layout === 0) {
					if (!this.#previous) return;
					[l, v] = this.#previous;
				} else {
					this.#previous = [layout, Number(dataset.variant)];
					v = 0;
				}
			}
			if (l) v = this.#cycle(v, 0, 2 ** l);
			dataset.layout = l;
			dataset.variant = v;
			this.sync();
		}

		focus(direction = 1, space = this.space) {
			const visible = this.visible.filter(
				(space) => space !== this.panel,
			);
			const index = visible.indexOf(space);
			this.focused =
				index < 0
					? visible.at(direction < 0 ? -1 : 0)
					: visible[this.#cycle(index, direction, visible.length)];
		}

		togglePanel() {
			if (!this.panels.length) return;
			pathless.el.classList.toggle('panel');
			this.sync();
		}

		bind(pair, gesture = 'tap', el = this.space.el.firstElementChild) {
			if (el) {
				const bindings = this.#bindings.get(el) ?? {};
				bindings[gesture] = Object.assign(
					bindings[gesture] ?? {},
					pair,
				);
				this.#bindings.set(el, bindings);
			}
			return this.input;
		}

		route(event) {
			const { gesture, direction, space } = event;
			const callback =
				this.#bindings.get(pathless.el)?.[gesture]?.[direction] ??
				this.#bindings.get(space.el.firstElementChild)?.[gesture]?.[
					direction
				];
			callback?.(event);
		}
	}

	class Pointer {
		state = null;

		constructor(universe) {
			this.down = (event) => {
				if (!event.isPrimary || event.button !== 0 || this.state)
					return;
				const { clientX, clientY } = event;
				const target = document.elementFromPoint(clientX, clientY);
				const space = universe.visible.find(({ el }) =>
					el.contains(target),
				);
				if (!space) return;
				pathless.el.setPointerCapture(event.pointerId);
				this.state = {
					id: event.pointerId,
					zero: { clientX, clientY, z: space },
				};
			};
			this.up = (event) => {
				const pointer = this.state;
				if (!pointer || pointer.id !== event.pointerId) return;
				this.state = null;
				if (
					event.defaultPrevented ||
					!universe.visible.includes(pointer.zero.z)
				)
					return;
				const result = this.xyz(event, pointer.zero);
				if (result) this.onGesture?.(result);
				return result;
			};
			this.cancel = (event) => {
				if (this.state?.id === event.pointerId) this.state = null;
			};
			pathless.el.addEventListener('pointerdown', this.down);
			pathless.el.addEventListener('pointerup', this.up);
			pathless.el.addEventListener('pointercancel', this.cancel);
			pathless.el.addEventListener('lostpointercapture', this.cancel);
		}

		normalize(point, { left = 0, top = 0, width, height } = pathless) {
			return {
				x: (point.clientX - left - width / 2) / (width / 2),
				y: (top + height / 2 - point.clientY) / (height / 2),
			};
		}

		xyz(event, zero) {
			const start = this.normalize(zero);
			const end = this.normalize(event);
			const delta = { x: end.x - start.x, y: end.y - start.y };
			if (Math.hypot(delta.x, delta.y) > 0.1) {
				if (Math.abs(delta.x) < Math.abs(delta.y)) return;
				return {
					gesture: 'swipe',
					direction: delta.x < 0 ? 'left' : 'right',
					space: zero.z,
				};
			}
			if (Math.hypot(end.x, end.y) <= 0.05)
				return { gesture: 'tap', direction: 'origin', space: zero.z };
			const point = this.normalize(
				event,
				zero.z.el.getBoundingClientRect(),
			);
			const horizontal = Math.abs(point.x) >= Math.abs(point.y);
			return {
				gesture: 'tap',
				direction: horizontal
					? point.x < 0
						? 'left'
						: 'right'
					: point.y > 0
						? 'up'
						: 'down',
				space: zero.z,
			};
		}
	}
</script>
