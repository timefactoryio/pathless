<div id="zero" class="space"></div>
<div id="one" class="space"></div>
<div id="two" class="space"></div>

<script>
	class Universe {
		#plane;
		#previous = null;
		#rendering = null;
		constructor(pathless) {
			this.pathless = pathless;
			this.el = document.getElementById('universe');
			this.#plane = this.el.getBoundingClientRect();
			new ResizeObserver(
				() => (this.#plane = this.el.getBoundingClientRect()),
			).observe(this.el);
			this.spaces = Array.from(
				this.el.querySelectorAll(':scope > .space'),
				(el) => ({ el, frame: 0, states: [], bindings: {} }),
			);
			this.input = new Input(this);
		}

		get #state() {
			const { layout, variant, focused } = this.el.dataset;
			return [layout, variant, focused].map(Number);
		}
		get space() {
			return this.#rendering ?? this.spaces[this.#state[2]];
		}
		get frame() {
			return this.space.el.querySelector(':scope > div');
		}
		get visible() {
			return this.spaces.filter(({ el }) => el.offsetParent !== null);
		}
		set view([layout, variant]) {
			this.el.dataset.layout = layout;
			this.el.dataset.variant = variant;
			this.sync();
		}

		set focused(space) {
			this.el.dataset.focused = this.spaces.indexOf(space);
		}

		coordinate({ clientX, clientY }) {
			const { left, top, width, height } = this.#plane;
			return {
				x: (2 * (clientX - left)) / (width || 1) - 1,
				y: 1 - (2 * (clientY - top)) / (height || 1),
			};
		}

		state() {
			const space = this.space;
			return (space.states[space.frame] ??= new Map());
		}

		sync(space) {
			try {
				for (const current of space ? [space] : this.visible) {
					this.#rendering = current;
					current.bindings = {};
					this.pathless.exec(
						current.el,
						this.pathless.frames[current.frame],
					);
				}
			} finally {
				this.#rendering = null;
			}
		}

		#cycle(index, direction, length) {
			return (index + direction + length) % length;
		}

		navigate(direction) {
			const space = this.space;
			const frame = this.#cycle(
				space.frame,
				direction,
				this.pathless.frames.length,
			);
			space.frame = frame;
			this.sync(space);
			return frame;
		}

		layout(layout) {
			const [current, variant] = this.#state;
			let next = 0;
			if (layout === 0) {
				if (current > 0) this.#previous = [current, variant];
				else if (this.#previous) [layout, next] = this.#previous;
				else return;
			} else {
				next = current === layout ? (variant + 1) % 2 ** layout : 0;
				this.#previous = [layout, next];
			}
			const view = [layout, next];
			this.view = view;
			return view;
		}

		focus(direction = 1) {
			const visible = this.visible;
			const current = this.space;
			if (visible.length < 2) return current;
			const next =
				visible[
					this.#cycle(
						visible.indexOf(current),
						direction,
						visible.length,
					)
				];
			this.focused = next;
			return next;
		}
	}

	class Input {
		#pointer;
		#keys;

		constructor(universe) {
			this.universe = universe;
			this.#keys = {
				1: () => universe.layout(0),
				2: () => universe.layout(1),
				3: () => universe.layout(2),
				tab: () => universe.focus(),
				q: () => universe.navigate(-1),
				e: () => universe.navigate(1),
				w: () => this.#activate('y', 1),
				a: () => this.#activate('x', -1),
				s: () => this.#activate('y', -1),
				d: () => this.#activate('x', 1),
			};
			window.addEventListener('keydown', this);
			for (const type of ['pointerdown', 'pointerup', 'pointercancel'])
				universe.el.addEventListener(type, this);
			let lastTap = 0;
			universe.el.addEventListener(
				'touchend',
				(event) => {
					const now = Date.now();
					if (now - lastTap < 300) event.preventDefault();
					lastTap = now;
				},
				{ passive: false },
			);
		}

		handleEvent(event) {
			this[event.type](event);
		}

		keydown(event) {
			const key = event.key.toLowerCase();
			if (key === 'tab') event.preventDefault();
			this.#keys[key]?.();
		}

		pointerdown(event) {
			if (this.#pointer) return;
			const space = this.universe.spaces.find(({ el }) =>
				el.contains(event.target),
			);
			if (space) this.universe.focused = space;
			this.#pointer = {
				id: event.pointerId,
				start: this.universe.coordinate(event),
			};
			event.currentTarget.setPointerCapture(event.pointerId);
		}

		pointerup(event) {
			if (event.pointerId !== this.#pointer?.id) return;
			const { start } = this.#pointer;
			this.#pointer = undefined;
			const end = this.universe.coordinate(event);
			const movement = { x: end.x - start.x, y: end.y - start.y };
			const tap = Math.hypot(movement.x, movement.y) < 0.25;
			const point = tap ? end : movement;
			const axis = Math.abs(point.x) >= Math.abs(point.y) ? 'x' : 'y';
			const direction = Math.sign(point[axis]);
			if (tap) this.#activate(axis, direction);
			else if (axis === 'x') this.universe.navigate(direction);
		}

		pointercancel(event) {
			if (event.pointerId === this.#pointer?.id)
				this.#pointer = undefined;
		}

		#activate(axis, direction) {
			this.universe.space.bindings[axis]?.[direction < 0 ? 0 : 1]?.();
		}

		#bind(axis, actions) {
			this.universe.space.bindings[axis] = actions;
			return this.universe;
		}

		x(left, right) {
			return this.#bind('x', [left, right]);
		}

		y(up, down) {
			return this.#bind('y', [down, up]);
		}
	}
</script>
