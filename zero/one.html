<div id="zero" class="space"></div>
<div id="one" class="space"></div>
<div id="two" class="space"></div>

<script>
	class Universe {
		#rendering = null;

		constructor() {
			this.el = document.getElementById('universe');
			this.spaces = ['zero', 'one', 'two'].map((id) => ({
				el: document.getElementById(id),
				frame: 0,
				state: [],
			}));

			this.layouts = [null, this.spaces.slice(0, 2), this.spaces.slice()];
			this.variants = [1, 2, 4];
			this.previous = null;

			const measure = () => (this.rect = this.el.getBoundingClientRect());
			measure();
			new ResizeObserver(measure).observe(this.el);
		}

		get l() {
			return Number(this.el.dataset.layout);
		}
		set l(value) {
			this.el.dataset.layout = value;
		}
		get v() {
			return Number(this.el.dataset.variant);
		}
		set v(value) {
			this.el.dataset.variant = value;
		}

		get active() {
			return Number(this.el.dataset.focused);
		}
		set active(index) {
			this.el.dataset.focused = index;
		}
		get space() {
			return this.#rendering ?? this.spaces[this.active];
		}
		set space(space) {
			this.active = this.spaces.indexOf(space);
		}
		get visible() {
			return this.layouts[this.l] ?? [this.space];
		}
		get frame() {
			return this.space.el.querySelector('div');
		}

		wrap(value, length) {
			return ((value % length) + length) % length;
		}

		read() {
			return (this.space.state[this.space.frame] ??= new Map());
		}

		write(key, value) {
			this.read().set(key, value);
		}

		pin() {
			const state = this.read();
			return {
				read: () => state,
				write: (key, value) => state.set(key, value),
			};
		}

		sync(space) {
			const visible = this.visible;
			if (!visible.includes(this.space)) this.space = visible[0];
			if (!pathless.frames?.length) return;
			try {
				for (const current of space ? [space] : visible) {
					this.#rendering = current;
					pathless.exec(current.el, pathless.frames[current.frame]);
				}
			} finally {
				this.#rendering = null;
			}
		}

		nav(step) {
			if (!pathless.frames?.length) return;
			this.space.frame = this.wrap(
				this.space.frame + step,
				pathless.frames.length,
			);
			this.sync(this.space);
			return this.space.frame;
		}

		layout(layout, variant) {
			const current = this.l;
			layout = this.wrap(layout, this.layouts.length);
			if (layout === 0 && variant === undefined) {
				if (current === 0 && this.previous)
					[layout, variant] = this.previous;
				else if (current > 0) this.previous = [current, this.v];
			}
			variant ??= layout === current ? this.v + 1 : 0;
			this.l = layout;
			this.v = this.wrap(variant, this.variants[layout]);
			this.sync();
		}

		focus(step = 1) {
			const visible = this.visible;
			this.space = visible[this.wrap(this.active + step, visible.length)];
			return this.active;
		}

		point(clientX, clientY) {
			const target = document.elementFromPoint(clientX, clientY);
			const space = this.spaces.find(({ el }) => el.contains(target));
			if (!space) return;
			this.space = space;
			const { left, top, width, height } = this.rect;
			const x = (2 * (clientX - left)) / (width || 1) - 1;
			const y = 1 - (2 * (clientY - top)) / (height || 1);
			return { x, y, space };
		}
	}

	class Input {
		#bindings = new Map();
		#active = new Map();

		constructor() {
			this.el = pathless.universe.el;

			for (const type of [
				'pointerdown',
				'pointermove',
				'pointerup',
				'pointercancel',
			])
				this.el.addEventListener(type, this);
			for (const type of ['keydown', 'keyup'])
				window.addEventListener(type, this);

			let lastTouch = 0;
			this.el.addEventListener(
				'touchend',
				(event) => {
					const now = performance.now();
					if (now - lastTouch < 300) event.preventDefault();
					lastTouch = now;
				},
				{ passive: false },
			);
			for (const type of ['gesturestart', 'gesturechange'])
				this.el.addEventListener(
					type,
					(event) => event.preventDefault(),
					{ passive: false },
				);
		}

		handleEvent(event) {
			this[event.type]?.(event);
		}

		keydown(event) {
			const name = event.key.toLowerCase();
			if (this.dispatch(name, event.repeat ? 'hold' : 'start', event))
				event.preventDefault();
		}

		keyup(event) {
			if (this.dispatch(event.key.toLowerCase(), 'end', event))
				event.preventDefault();
		}

		pointerdown(event) {
			const point = pathless.universe.point(event.clientX, event.clientY);
			if (!point) return;
			this.el.setPointerCapture(event.pointerId);
			this.#active.set(event.pointerId, point);
			this.dispatch('point', 'start', event);
		}

		pointermove(event) {
			if (!this.#active.has(event.pointerId)) return;
			this.dispatch('point', 'hold', event);
		}

		pointerup(event) {
			const origin = this.#active.get(event.pointerId);
			if (!origin) return;
			this.#discrete(event, origin);
			this.#active.delete(event.pointerId);
			this.dispatch('point', 'end', event);
		}

		pointercancel(event) {
			if (!this.#active.delete(event.pointerId)) return;
			this.dispatch('point', 'cancel', event);
		}

		#discrete(event, origin) {
			const point = pathless.universe.point(event.clientX, event.clientY);
			if (!point) return;
			const dx = point.x - origin.x;
			const dy = point.y - origin.y;
			if (Math.abs(dx) >= 0.25 && Math.abs(dx) > Math.abs(dy)) {
				pathless.universe.nav(dx < 0 ? 1 : -1);
				return;
			}
			const direction =
				Math.abs(point.x) > Math.abs(point.y)
					? point.x < 0
						? 'left'
						: 'right'
					: point.y < 0
						? 'down'
						: 'up';
			this.dispatch('tap', direction, event);
		}

		bind(bindings) {
			for (const [name, binding] of Object.entries(bindings))
				this.#bindings.set(name, binding);
			return this;
		}

		dispatch(name, phase, value) {
			const binding = this.#bindings.get(name);
			if (!binding) return false;

			if (typeof binding === 'function') {
				if (phase !== 'end') binding(value);
			} else {
				binding[phase]?.(value);
			}
			return true;
		}
	}

	pathless.universe = new Universe();
	pathless.input = new Input();
</script>
