<div id="zero" class="space"></div>
<div id="one" class="space"></div>
<div id="two" class="space"></div>

<script>
	class Universe {
		#plane;
		#previous = null;
		#rendering = null;
		constructor(pathless) {
			this.pathless = pathless;
			this.el = document.getElementById('universe');
			this.#plane = this.el.getBoundingClientRect();
			new ResizeObserver(
				() => (this.#plane = this.el.getBoundingClientRect()),
			).observe(this.el);
			this.spaces = Array.from(
				this.el.querySelectorAll(':scope > .space'),
				(el) => ({ el, frame: 0, states: [], bindings: {} }),
			);
			this.layouts = [
				{ variants: [0] },
				{ variants: [0, 1] },
				{ variants: [0, 1, 2, 3] },
			];
			this.input = new Input(this);
			this.sync();
		}

		get #state() {
			const { layout, variant, focused } = this.el.dataset;
			return [layout, variant, focused].map(Number);
		}
		get space() {
			return this.#rendering ?? this.spaces[this.#state[2]];
		}
		get frame() {
			return this.space.el.querySelector(':scope > div');
		}
		get visible() {
			return this.spaces.filter(({ el }) => el.offsetParent !== null);
		}
		set view([layout, variant]) {
			this.el.dataset.layout = layout;
			this.el.dataset.variant = variant;
			this.sync();
		}

		set focused(space) {
			this.el.dataset.focused = this.spaces.indexOf(space);
		}

		coordinate({ clientX, clientY }) {
			const { left, top, width, height } = this.#plane;
			return {
				x: (2 * (clientX - left)) / (width || 1) - 1,
				y: 1 - (2 * (clientY - top)) / (height || 1),
			};
		}

		state() {
			const space = this.space;
			return (space.states[space.frame] ??= new Map());
		}

		sync(space) {
			try {
				for (const current of space ? [space] : this.visible) {
					this.#rendering = current;
					current.bindings = {};
					this.pathless.exec(
						current.el,
						this.pathless.frames[current.frame],
					);
				}
			} finally {
				this.#rendering = null;
			}
		}

		#cycle(index, direction, length) {
			return (index + direction + length) % length;
		}

		navigate(direction) {
			const space = this.space;
			const frame = this.#cycle(
				space.frame,
				direction,
				this.pathless.frames.length,
			);
			space.frame = frame;
			this.sync(space);
			return frame;
		}

		layout(layout) {
			const [current, variant] = this.#state;
			let next;
			if (layout === undefined) {
				if (current > 0) [layout, next] = [0, 0];
				else if (this.#previous) [layout, next] = this.#previous;
				else return;
			} else {
				const variants = this.layouts[layout].variants;
				next = current === layout ? (variant + 1) % variants.length : 0;
			}
			if (layout > 0) this.#previous = [layout, next];
			else if (current > 0) this.#previous = [current, variant];
			this.view = [layout, next];
			return [layout, next];
		}

		focus(direction = 1) {
			const visible = this.visible;
			const current = this.space;
			if (visible.length < 2) return current;
			const next =
				visible[
					this.#cycle(
						visible.indexOf(current),
						direction,
						visible.length,
					)
				];
			this.focused = next;
			return next;
		}
	}

	class Input {
		#active;

		constructor(universe) {
			this.universe = universe;
			const keys = {
				1: () => universe.layout(0),
				2: () => universe.layout(1),
				3: () => universe.layout(2),
				tab: () => universe.focus(),
				q: () => universe.navigate(-1),
				e: () => universe.navigate(1),
				w: () => this.#axis('y', 1),
				a: () => this.#axis('x', -1),
				s: () => this.#axis('y', -1),
				d: () => this.#axis('x', 1),
			};
			window.addEventListener('keydown', (event) => {
				const key = event.key.toLowerCase();
				if (key === 'tab') event.preventDefault();
				keys[key]?.();
			});

			universe.el.addEventListener('pointerdown', (event) => {
				if (this.#active) return;
				this.#active = {
					id: event.pointerId,
					start: universe.coordinate(event),
				};
				event.currentTarget.setPointerCapture(event.pointerId);
			});
			universe.el.addEventListener('pointerup', (event) => {
				if (event.pointerId !== this.#active?.id) return;
				const start = this.#active.start;
				this.#active = undefined;
				this.#gesture(start, universe.coordinate(event));
			});
			universe.el.addEventListener('pointercancel', (event) => {
				if (event.pointerId === this.#active?.id)
					this.#active = undefined;
			});
		}

		#gesture(start, end) {
			const movement = { x: end.x - start.x, y: end.y - start.y };
			if (Math.hypot(movement.x, movement.y) < 0.25) {
				const axis = Math.abs(end.x) >= Math.abs(end.y) ? 'x' : 'y';
				this.#axis(axis, end[axis]);
			} else if (Math.abs(movement.x) >= Math.abs(movement.y))
				this.universe.navigate(Math.sign(movement.x));
		}

		#axis(axis, direction) {
			this.universe.space.bindings[axis]?.[direction < 0 ? 0 : 1]?.();
		}

		#bind(axis, actions) {
			this.universe.space.bindings[axis] = actions;
			return this.universe;
		}

		x(left, right) {
			return this.#bind('x', [left, right]);
		}

		y(up, down) {
			return this.#bind('y', [down, up]);
		}
	}
</script>
