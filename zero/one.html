<div id="zero" class="space"></div>
<div id="one" class="space"></div>
<div id="two" class="space"></div>
<div id="panel" class="space" hidden></div>

<script>
	class Universe {
		#plane;
		#previous = null;
		#rendering = null;
		constructor(pathless) {
			this.pathless = pathless;
			this.el = document.getElementById('universe');
			this.#plane = this.el.getBoundingClientRect();
			new ResizeObserver(
				() => (this.#plane = this.el.getBoundingClientRect()),
			).observe(this.el);
			this.spaces = Array.from(
				this.el.querySelectorAll(':scope > .space'),
				(el, index) => ({
					el,
					frame: 0,
					states: [],
					bindings: {},
					frames: index === 3 ? pathless.panels : pathless.frames,
				}),
			);
			this.panel = this.spaces[3];
			this.input = new Input(this);
		}

		get #state() {
			const { layout, variant, focused } = this.el.dataset;
			return [layout, variant, focused].map(Number);
		}
		get space() {
			return this.#rendering ?? this.spaces[this.#state[2]];
		}
		get frame() {
			return this.space.el.querySelector(':scope > div');
		}
		get previous() {
			return this.#previous;
		}
		get visible() {
			return this.spaces
				.slice(0, 3)
				.filter(({ el }) => el.offsetParent !== null);
		}
		set view([layout, variant]) {
			this.el.dataset.layout = layout;
			this.el.dataset.variant = variant;
			this.sync();
		}

		set focused(space) {
			this.el.dataset.focused = this.spaces.indexOf(space);
		}

		coordinate({ clientX, clientY }) {
			const { left, top, width, height } = this.#plane;
			return {
				x: (2 * (clientX - left)) / (width || 1) - 1,
				y: 1 - (2 * (clientY - top)) / (height || 1),
			};
		}
		coordinates(start, end) {
			const x = end.x - start.x;
			const y = end.y - start.y;
			return { x, y, distance: Math.hypot(x, y) };
		}
		state() {
			const space = this.space;
			return (space.states[space.frame] ??= new Map());
		}

		sync(space) {
			try {
				for (const current of space ? [space] : this.visible) {
					this.#rendering = current;
					current.bindings = {};
					this.pathless.exec(
						current.el,
						current.frames[current.frame],
					);
				}
			} finally {
				this.#rendering = null;
			}
		}

		togglePanel() {
			if (!this.panel.frames.length) return false;
			this.panel.el.hidden = !this.panel.el.hidden;
			if (!this.panel.el.hidden && !this.panel.el.firstElementChild)
				this.sync(this.panel);
			return !this.panel.el.hidden;
		}

		#cycle(index, direction, length) {
			return (index + direction + length) % length;
		}

		navigate(direction) {
			const space = this.space;
			const frame = this.#cycle(
				space.frame,
				direction,
				this.pathless.frames.length,
			);
			space.frame = frame;
			this.sync(space);
			return frame;
		}

		layout(layout) {
			const [current, variant] = this.#state;
			let next = 0;
			if (layout === 0) {
				if (current > 0) this.#previous = [current, variant];
				else if (this.#previous) [layout, next] = this.#previous;
				else return;
			} else {
				next = current === layout ? (variant + 1) % 2 ** layout : 0;
				this.#previous = [layout, next];
			}
			const view = [layout, next];
			this.view = view;
			return view;
		}

		focus(direction = 1) {
			const visible = this.visible;
			const current = this.space;
			if (visible.length < 2) return current;
			const next =
				visible[
					this.#cycle(
						visible.indexOf(current),
						direction,
						visible.length,
					)
				];
			this.focused = next;
			return next;
		}
	}

	class Input {
		constructor(universe) {
			this.universe = universe;
			this.keyboard = new Keyboard(this);
			this.pointer = new Pointer(this);
			let lastTap = 0;
			universe.el.addEventListener(
				'touchend',
				(event) => {
					const now = Date.now();
					if (now - lastTap < 300) event.preventDefault();
					lastTap = now;
				},
				{ passive: false },
			);
		}

		command(direction) {
			this.universe.space.bindings[direction]?.();
		}

		#bind(type, direction, callback) {
			this.universe.space.bindings[`${type}:${direction}`] = callback;
			return this.universe;
		}

		tap(direction, callback) {
			return this.#bind('tap', direction, callback);
		}

		swipe(direction, callback) {
			return this.#bind('swipe', direction, callback);
		}

		scale(direction, callback) {
			return this.#bind('scale', direction, callback);
		}

		up(callback) {
			return this.tap('up', callback);
		}

		down(callback) {
			return this.tap('down', callback);
		}

		left(callback) {
			return this.tap('left', callback);
		}

		right(callback) {
			return this.tap('right', callback);
		}

		forward(callback) {
			return this.tap('forward', callback);
		}
		back(callback) {
			return this.tap('back', callback);
		}
	}

	class Keyboard {
		constructor(input) {
			const { universe } = input;
			const keys = {
				1: () => universe.layout(0),
				2: () => universe.layout(1),
				3: () => universe.layout(2),
				tab: () => universe.focus(),
				q: () => universe.navigate(-1),
				e: () => universe.navigate(1),
				z: () => universe.togglePanel(),
			};
			window.addEventListener('keydown', (event) => {
				const action = keys[event.key.toLowerCase()];
				if (
					!action ||
					event.metaKey ||
					event.ctrlKey ||
					event.altKey ||
					event.target.closest?.(
						'input, textarea, select, [contenteditable]',
					)
				)
					return;
				event.preventDefault();
				action();
			});
		}
	}

	class Pointer {
		#distance;
		#pointers = new Map();

		constructor(input) {
			const { universe } = input;
			this.input = input;
			this.universe = universe;
			this.interval = 0.25;
			this.gestures = ['tap', 'swipe', 'scale'];
			this.directions = ['up', 'down', 'left', 'right'];
			for (const type of [
				'pointerdown',
				'pointermove',
				'pointerup',
				'pointercancel',
			])
				universe.el.addEventListener(type, this);
		}

		handleEvent(event) {
			this[event.type](event);
		}

		pointerdown(event) {
			if (this.#pointers.size === 2) return;
			this.#pointers.set(event.pointerId, [
				this.universe.coordinate(event),
			]);
			if (this.#pointers.size === 2) {
				const [first, second] = this.#pointers.values();
				this.#distance = this.universe.coordinates(
					first[0],
					second[0],
				).distance;
			}
			event.currentTarget.setPointerCapture(event.pointerId);
		}

		pointermove(event) {
			if (this.#pointers.size !== 2) return;
			const points = this.#pointers.get(event.pointerId);
			if (!points) return;
			points[1] = this.universe.coordinate(event);
			this.two();
		}

		pointerup(event) {
			const points = this.#pointers.get(event.pointerId);
			if (!points) return;
			if (this.#pointers.size === 1) this.one(event);
			this.#pointers.clear();
			this.#distance = undefined;
		}

		pointercancel() {
			this.#pointers.clear();
			this.#distance = undefined;
		}

		one(event) {
			const [points] = this.#pointers.values();
			points.push(this.universe.coordinate(event));
			const movement = this.universe.coordinates(...points);
			const isTap = movement.distance < this.interval;
			const { x, y } = isTap ? points[1] : movement;
			const direction =
				this.directions[
					Math.abs(x) >= Math.abs(y)
						? 2 + Number(x >= 0)
						: Number(y < 0)
				];
			this.input.command(`${this.gestures[Number(!isTap)]}:${direction}`);
		}

		two() {
			const [first, second] = this.#pointers.values();
			const distance = this.universe.coordinates(
				first.at(-1),
				second.at(-1),
			).distance;
			const change = distance - this.#distance;
			const steps = Math.floor(Math.abs(change) / this.interval);
			if (!steps) return;
			const direction = this.directions[Number(change < 0)];
			for (let step = 0; step < steps; step++)
				this.input.command(`${this.gestures[2]}:${direction}`);
			this.#distance += Math.sign(change) * steps * this.interval;
		}
	}
</script>
