<div id="zero" class="space"></div>
<div id="one" class="space"></div>
<div id="two" class="space"></div>

<script>
	class Universe {
		#rendering = null;

		constructor() {
			this.el = document.getElementById('universe');
			this.spaces = ['zero', 'one', 'two'].map((id) => ({
				el: document.getElementById(id),
				frame: 0,
				state: [],
			}));
			this.layouts = [null, this.spaces.slice(0, 2), this.spaces.slice()];
			this.variants = [1, 2, 4];
			this.previous = null;
			this.input = new Input(this);
		}

		get l() {
			return Number(this.el.dataset.layout);
		}
		set l(value) {
			this.el.dataset.layout = value;
		}
		get v() {
			return Number(this.el.dataset.variant);
		}
		set v(value) {
			this.el.dataset.variant = value;
		}

		get active() {
			return Number(this.el.dataset.focused);
		}
		set active(index) {
			this.el.dataset.focused = index;
		}
		get space() {
			return this.#rendering ?? this.spaces[this.active];
		}
		set space(space) {
			this.active = this.spaces.indexOf(space);
		}
		get visible() {
			return this.layouts[this.l] ?? [this.space];
		}
		get frame() {
			return this.space.el.querySelector('div');
		}

		wrap(value, length) {
			return ((value % length) + length) % length;
		}

		read() {
			return (this.space.state[this.space.frame] ??= new Map());
		}

		write(key, value) {
			this.read().set(key, value);
		}

		pin() {
			const state = this.read();
			return {
				read: () => state,
				write: (key, value) => state.set(key, value),
			};
		}

		sync(space) {
			const visible = this.visible;
			if (!visible.includes(this.space)) this.space = visible[0];
			if (!pathless.frames?.length) return;
			try {
				for (const current of space ? [space] : visible) {
					this.#rendering = current;
					this.input.clear(current);
					pathless.exec(current.el, pathless.frames[current.frame]);
				}
			} finally {
				this.#rendering = null;
			}
		}

		nav(step) {
			return (space = this.space) => {
				if (!pathless.frames?.length) return;
				space.frame = this.wrap(
					space.frame + step,
					pathless.frames.length,
				);
				this.sync(space);
				return space.frame;
			};
		}

		syncLayout(layout = this.l, variant = this.v) {
			const previous = [this.l, this.v];
			this.l = this.wrap(layout, this.layouts.length);
			this.v = this.wrap(variant, this.variants[this.l]);
			if (previous[0] !== this.l) this.previous = previous;
			this.sync();
			return [this.l, this.v];
		}

		layout(step = 1) {
			return () => this.syncLayout(this.l + step);
		}

		variant(step = 1) {
			return () => this.syncLayout(this.l, this.v + step);
		}

		focus(step = 1) {
			const visible = this.visible;
			this.space = visible[this.wrap(this.active + step, visible.length)];
			return this.active;
		}
	}

	class Input {
		#active = [];
		#bindings = new WeakMap();
		#inputs;

		constructor(universe) {
			this.universe = universe;
			this.delta = 0.2;
			this.#inputs = [
				{ type: 'tap', axis: 'x', keys: ['a', 'd'] },
				{ type: 'tap', axis: 'y', keys: ['s', 'w'] },
				{
					type: 'swipe',
					axis: 'x',
					keys: ['q', 'e'],
					control: [universe.nav(-1), universe.nav(1)],
				},
				{ type: 'swipe', axis: 'y' },
				{
					type: 'scale',
					axis: 'x',
					control: [universe.variant(-1), universe.variant(1)],
				},
				{
					type: 'scale',
					axis: 'y',
					control: [universe.layout(-1), universe.layout(1)],
				},
			];
			for (const { type, axis, control } of this.#inputs) {
				if (control) continue;
				this[type] ??= {};
				this[type][axis] = (decrement, increment) =>
					this.#bind(type, axis, decrement, increment);
			}

			const measure = () =>
				(this.rect = universe.el.getBoundingClientRect());
			measure();
			new ResizeObserver(measure).observe(universe.el);

			universe.el.addEventListener('pointerdown', (event) =>
				this.#pointerdown(event),
			);
			universe.el.addEventListener('pointermove', (event) =>
				this.#pointermove(event),
			);
			universe.el.addEventListener('pointerup', (event) =>
				this.#pointerup(event),
			);
			universe.el.addEventListener('pointercancel', (event) =>
				this.#pointercancel(event),
			);
			window.addEventListener('keydown', (event) => this.#keydown(event));
			window.addEventListener('keyup', (event) => this.#keyup(event));
		}

		#bind(type, axis, decrement, increment) {
			const space = this.universe.space;
			const frames = this.#bindings.get(space) ?? [];
			const bindings = (frames[space.frame] ??= {});
			(bindings[type] ??= {})[axis] = [decrement, increment];
			this.#bindings.set(space, frames);
			return this;
		}

		clear(space) {
			const frames = this.#bindings.get(space);
			if (frames) frames[space.frame] = {};
		}

		#keydown(event) {
			const key = event.key.toLowerCase();
			const input = this.#inputs.find(({ keys }) => keys?.includes(key));
			if (!input || this.#active.some(({ id }) => id === key)) return;

			const space = this.universe.space;
			this.#active.push({ id: key, coordinates: [], space });
			this.#call(space, input.type, {
				axis: input.axis,
				step: input.keys.indexOf(key) ? 1 : -1,
			});
		}

		#keyup(event) {
			const key = event.key.toLowerCase();
			const index = this.#active.findIndex((input) => input.id === key);
			if (index < 0) return;

			this.#active.splice(index, 1);
		}

		#pointerdown(event) {
			if (this.#active.some((input) => input.id === event.pointerId))
				return;

			const point = this.#point(event);
			if (!point) return;
			this.universe.space = point.space;

			this.#active.push({
				id: event.pointerId,
				coordinates: [point],
			});
			this.universe.el.setPointerCapture(event.pointerId);
		}

		#pointermove(event) {
			const input = this.#active.find(
				(input) => input.id === event.pointerId,
			);
			if (!input) return;

			const space = input.coordinates[0].space;
			const point = this.#point(event, space);
			const last = input.coordinates[input.coordinates.length - 1];
			if (
				this.#movement(point.x - last.x, point.y - last.y).distance <
				this.delta
			)
				return;

			input.coordinates.push(point);
			this.#classify();
		}

		#pointerup(event) {
			const index = this.#active.findIndex(
				(input) => input.id === event.pointerId,
			);
			if (index < 0) return;

			const input = this.#active[index];
			const start = input.coordinates[0];
			const point = this.#point(event, start.space);
			input.coordinates.push(point);
			this.#classify();

			if (this.universe.el.hasPointerCapture(event.pointerId))
				this.universe.el.releasePointerCapture(event.pointerId);

			this.#active.splice(index, 1);
		}

		#pointercancel(event) {
			const index = this.#active.findIndex(
				(input) => input.id === event.pointerId,
			);
			if (index < 0) return;

			if (this.universe.el.hasPointerCapture(event.pointerId))
				this.universe.el.releasePointerCapture(event.pointerId);

			this.#active.splice(index, 1);
		}

		#classify() {
			const pointers = this.#active.filter(
				(input) => input.coordinates.length,
			);
			if (pointers.length === 1) {
				const coordinates = pointers[0].coordinates;
				const start = coordinates[0];
				const last = coordinates.at(-1);
				const movement = this.#movement(
					last.x - start.x,
					last.y - start.y,
				);
				if (movement.distance >= this.delta) {
					this.#call(start.space, 'swipe', movement);
					return;
				}

				const position = this.#movement(last.x, last.y);
				if (position.distance < this.delta) return;
				this.#call(start.space, 'tap', position);
				return;
			}

			if (pointers.length !== 2) return;
			const [first, second] = pointers;
			const firstStart = first.coordinates[0];
			const secondStart = second.coordinates[0];
			const firstLast = first.coordinates.at(-1);
			const secondLast = second.coordinates.at(-1);
			const scale = this.#movement(
				Math.abs(secondLast.x - firstLast.x) -
					Math.abs(secondStart.x - firstStart.x),
				Math.abs(secondLast.y - firstLast.y) -
					Math.abs(secondStart.y - firstStart.y),
			);
			if (scale.distance >= this.delta)
				this.#call(firstStart.space, 'scale', scale);
		}

		#call(space, type, { axis, step }) {
			const index = step < 0 ? 0 : 1;
			const control = this.#inputs.find(
				(input) => input.type === type && input.axis === axis,
			)?.control?.[index];
			if (control) control(space);
			else
				this.#bindings
					.get(space)
					?.[space.frame]?.[type]?.[axis]?.[index]?.();
		}

		#movement(x, y) {
			const axis = Math.abs(x) >= Math.abs(y) ? 'x' : 'y';
			return {
				distance: Math.hypot(x, y),
				axis,
				step: Math.sign(axis === 'x' ? x : y),
			};
		}

		#point(event, space) {
			if (!space) {
				const target = document.elementFromPoint(
					event.clientX,
					event.clientY,
				);
				space = this.universe.spaces.find(({ el }) =>
					el.contains(target),
				);
			}
			if (!space) return;
			const { left, top, width, height } = this.rect;
			const x = (2 * (event.clientX - left)) / (width || 1) - 1;
			const y = 1 - (2 * (event.clientY - top)) / (height || 1);
			return { x, y, space };
		}
	}
</script>
