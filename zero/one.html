<div id="zero" class="space"></div>
<div id="one" class="space"></div>
<div id="two" class="space"></div>

<script>
	class Universe {
		#rendering = null;

		constructor() {
			this.el = document.getElementById('universe');
			this.spaces = ['zero', 'one', 'two'].map((id) => ({
				el: document.getElementById(id),
				frame: 0,
				state: [],
				bindings: [],
			}));
			this.tap = this.#directions('tap', {
				up: ['arrowup', 'w'],
				down: ['arrowdown', 's'],
				left: ['arrowleft', 'a'],
				right: ['arrowright', 'd'],
			});
			this.swipe = this.#directions('swipe');

			this.layouts = [null, this.spaces.slice(0, 2), this.spaces.slice()];
			this.variants = [1, 2, 4];
			this.previous = null;

			const measure = () => (this.rect = this.el.getBoundingClientRect());
			measure();
			new ResizeObserver(measure).observe(this.el);
		}

		get l() {
			return Number(this.el.dataset.layout);
		}
		set l(value) {
			this.el.dataset.layout = value;
		}
		get v() {
			return Number(this.el.dataset.variant);
		}
		set v(value) {
			this.el.dataset.variant = value;
		}

		get active() {
			return Number(this.el.dataset.focused);
		}
		set active(index) {
			this.el.dataset.focused = index;
		}
		get space() {
			return this.#rendering ?? this.spaces[this.active];
		}
		set space(space) {
			this.active = this.spaces.indexOf(space);
		}
		get visible() {
			return this.layouts[this.l] ?? [this.space];
		}
		get frame() {
			return this.space.el.querySelector('div');
		}

		wrap(value, length) {
			return ((value % length) + length) % length;
		}

		read() {
			return (this.space.state[this.space.frame] ??= new Map());
		}

		write(key, value) {
			this.read().set(key, value);
		}

		pin() {
			const state = this.read();
			return {
				read: () => state,
				write: (key, value) => state.set(key, value),
			};
		}

		sync(space) {
			const visible = this.visible;
			if (!visible.includes(this.space)) this.space = visible[0];
			if (!pathless.frames?.length) return;
			try {
				for (const current of space ? [space] : visible) {
					this.#rendering = current;
					current.bindings[current.frame] = new Map();
					pathless.exec(current.el, pathless.frames[current.frame]);
				}
			} finally {
				this.#rendering = null;
			}
		}

		nav(step) {
			if (!pathless.frames?.length) return;
			this.space.frame = this.wrap(
				this.space.frame + step,
				pathless.frames.length,
			);
			this.sync(this.space);
			return this.space.frame;
		}

		layout(layout, variant) {
			const current = this.l;
			layout = this.wrap(layout, this.layouts.length);
			if (layout === 0 && variant === undefined) {
				if (current === 0 && this.previous)
					[layout, variant] = this.previous;
				else if (current > 0) this.previous = [current, this.v];
			}
			variant ??= layout === current ? this.v + 1 : 0;
			this.l = layout;
			this.v = this.wrap(variant, this.variants[layout]);
			this.sync();
		}

		focus(step = 1) {
			const visible = this.visible;
			this.space = visible[this.wrap(this.active + step, visible.length)];
			return this.active;
		}

		vertical(callback) {
			this.#bind('vertical', callback);
			return this;
		}

		horizontal(callback) {
			this.#bind('horizontal', callback);
			return this;
		}

		dispatch(name, value) {
			const callback = this.space.bindings[this.space.frame]?.get(name);
			callback?.(value);
			return Boolean(callback);
		}

		pointer(type, pointers, event) {}

		point(event, space) {
			if (!space) {
				const target = document.elementFromPoint(
					event.clientX,
					event.clientY,
				);
				space = this.spaces.find(({ el }) => el.contains(target));
			}
			if (!space) return;
			const { left, top, width, height } = this.rect;
			const x = (2 * (event.clientX - left)) / (width || 1) - 1;
			const y = 1 - (2 * (event.clientY - top)) / (height || 1);
			return { x, y, space };
		}

		#bind(name, callback) {
			const bindings = (this.space.bindings[this.space.frame] ??=
				new Map());
			bindings.set(name, callback);
		}

		#directions(prefix, aliases = {}) {
			const directions = {};
			for (const direction of ['up', 'down', 'left', 'right'])
				directions[direction] = (callback) => {
					for (const name of [
						`${prefix}.${direction}`,
						...(aliases[direction] ?? []),
					])
						this.#bind(name, callback);
					return directions;
				};
			return directions;
		}
	}

	class Input {
		#active = new Map();
		#space = null;

		constructor(universe) {
			this.universe = universe;

			for (const type of [
				'pointerdown',
				'pointermove',
				'pointerup',
				'pointercancel',
			])
				universe.el.addEventListener(type, (event) =>
					this[type](event),
				);
			for (const type of ['keydown', 'keyup'])
				window.addEventListener(type, (event) => {
					if (universe.dispatch(event.key.toLowerCase(), event))
						event.preventDefault();
				});
		}

		get active() {
			return [...this.#active.values()];
		}

		pointerdown(event) {
			if (this.#active.size === 2 || this.#active.has(event.pointerId))
				return;

			const point = this.universe.point(event);
			if (!point || (this.#space && point.space !== this.#space)) return;
			if (!this.#space) {
				this.#space = point.space;
				this.universe.space = point.space;
			}

			this.#active.set(event.pointerId, { start: point, point });
			this.universe.el.setPointerCapture(event.pointerId);
			this.universe.pointer('down', this.active, event);
		}

		pointerup(event) {
			this.#finish('up', event);
		}

		pointercancel(event) {
			this.#finish('cancel', event);
		}

		pointermove(event) {
			const active = this.#active.get(event.pointerId);
			if (!active) return;
			active.point = this.universe.point(event, this.#space);
			this.universe.pointer('move', this.active, event);
		}

		#finish(type, event) {
			const active = this.#active.get(event.pointerId);
			if (!active) return;
			active.point = this.universe.point(event, this.#space);
			this.universe.pointer(type, this.active, event);

			if (this.universe.el.hasPointerCapture(event.pointerId))
				this.universe.el.releasePointerCapture(event.pointerId);
			this.#active.delete(event.pointerId);
			if (!this.#active.size) this.#space = null;
		}
	}

	pathless.universe = new Universe();
	pathless.input = new Input(pathless.universe);
</script>
