<div id="zero" class="space"></div>
<div id="one" class="space"></div>
<div id="two" class="space"></div>

<script>
	class Universe {
		static layouts = [null, [0, 1], [0, 1, 2]];
		static variants = [1, 2, 4];
		static #wrap(value, length) {
			return ((value % length) + length) % length;
		}

		constructor(pathless) {
			this.pathless = pathless;
			this.element = document.getElementById('universe');
			this.spaces = ['zero', 'one', 'two'].map((id) => ({
				element: document.getElementById(id),
				frame: 0,
				state: new Map(),
			}));
			this.previous = null;
			const measure = () =>
				(this.rect = this.element.getBoundingClientRect());
			measure();
			new ResizeObserver(measure).observe(this.element);
		}

		get focused() {
			return Number(this.element.dataset.focused);
		}
		set focused(index) {
			this.element.dataset.focused = index;
		}
		get space() {
			return this.spaces[this.focused];
		}
		get frame() {
			return this.space.element.querySelector('div');
		}
		get current() {
			const layout = Number(this.element.dataset.layout);
			return {
				layout,
				variant: Number(this.element.dataset.variant),
				visible: Universe.layouts[layout] ?? [this.focused],
			};
		}
		set current({ layout, variant }) {
			this.element.dataset.layout = layout;
			this.element.dataset.variant = variant;
		}

		read(index = this.focused) {
			const space = this.spaces[index];
			let state = space.state.get(space.frame);
			if (!state) space.state.set(space.frame, (state = new Map()));
			return state;
		}

		write(key, value, index = this.focused) {
			this.read(index).set(key, value);
		}

		pin(index = this.focused) {
			return {
				index,
				read: () => this.read(index),
				write: (key, value) => this.write(key, value, index),
			};
		}

		sync(...indices) {
			if (!this.pathless.frames?.length) return;
			const focused = this.focused;
			for (const index of indices.length
				? indices
				: this.current.visible) {
				this.focused = index;
				const space = this.spaces[index];
				this.pathless.exec(
					space.element,
					this.pathless.frames[space.frame],
				);
			}
			this.focused = focused;
		}

		nav(step, index = this.focused) {
			const frames = this.pathless.frames;
			if (!frames?.length) return;
			const space = this.spaces[index];
			space.frame = Universe.#wrap(space.frame + step, frames.length);
			this.sync(index);
			return space.frame;
		}

		layout(layout, variant = 0) {
			const variants = Universe.variants[layout];
			if (!variants || variant < 0 || variant >= variants) return false;

			if (layout > 0) this.previous = { layout, variant };
			this.current = { layout, variant };
			const { visible } = this.current;
			if (!visible.includes(this.focused)) this.focused = visible[0];
			this.sync();
			return true;
		}

		cycle(layoutStep = 0, variantStep = 0) {
			const current = this.current;
			const layout = Universe.#wrap(
				current.layout + layoutStep,
				Universe.layouts.length,
			);
			const variants = Universe.variants[layout];
			const variant = Universe.#wrap(
				(layout === current.layout ? current.variant : 0) + variantStep,
				variants,
			);
			return this.layout(layout, variant);
		}

		select(layout) {
			const { layout: current } = this.current;
			if (layout === 0 && current === 0 && this.previous)
				return this.layout(this.previous.layout, this.previous.variant);
			return current === layout ? this.cycle(0, 1) : this.layout(layout);
		}

		focus(step = 1) {
			const { visible } = this.current;
			const index = visible.indexOf(this.focused);
			this.focused =
				visible[Universe.#wrap(index + step, visible.length)];
			return this.focused;
		}

		point(clientX, clientY, index = this.focused) {
			this.focused = index;
			const { left, top, width, height } = this.rect;
			const x = (2 * (clientX - left)) / (width || 1) - 1;
			const y = 1 - (2 * (clientY - top)) / (height || 1);
			return { x, y };
		}
	}

	class Input {
		#bindings = new Map();
		#active = new Map();

		constructor(universe) {
			this.universe = universe;
			this.element = universe.element;

			for (const type of [
				'pointerdown',
				'pointermove',
				'pointerup',
				'pointercancel',
			])
				this.element.addEventListener(type, this);
			for (const type of ['keydown', 'keyup'])
				window.addEventListener(type, this);

			let lastTouch = 0;
			this.element.addEventListener(
				'touchend',
				(event) => {
					const now = performance.now();
					if (now - lastTouch < 300) event.preventDefault();
					lastTouch = now;
				},
				{ passive: false },
			);
			for (const type of ['gesturestart', 'gesturechange'])
				this.element.addEventListener(
					type,
					(event) => event.preventDefault(),
					{ passive: false },
				);
		}

		handleEvent(event) {
			this[event.type]?.(event);
		}

		keydown(event) {
			const name = event.key.toLowerCase();
			if (this.dispatch(name, event.repeat ? 'hold' : 'start', event))
				event.preventDefault();
		}

		keyup(event) {
			if (this.dispatch(event.key.toLowerCase(), 'end', event))
				event.preventDefault();
		}

		pointerdown(event) {
			const index = this.universe.spaces.findIndex(({ element }) =>
				element.contains(event.target),
			);
			if (index < 0) return;
			const point = this.universe.point(
				event.clientX,
				event.clientY,
				index,
			);
			this.element.setPointerCapture(event.pointerId);
			this.#active.set(event.pointerId, { index, point });
			this.dispatch('point', 'start', event);
		}

		pointermove(event) {
			if (!this.#active.has(event.pointerId)) return;
			this.dispatch('point', 'hold', event);
		}

		pointerup(event) {
			const origin = this.#active.get(event.pointerId);
			if (!origin) return;
			this.#discrete(event, origin);
			this.#active.delete(event.pointerId);
			this.dispatch('point', 'end', event);
		}

		pointercancel(event) {
			if (!this.#active.delete(event.pointerId)) return;
			this.dispatch('point', 'cancel', event);
		}

		#discrete(event, origin) {
			const point = this.universe.point(
				event.clientX,
				event.clientY,
				origin.index,
			);
			const dx = point.x - origin.point.x;
			const dy = point.y - origin.point.y;
			if (Math.abs(dx) >= 0.25 && Math.abs(dx) > Math.abs(dy)) {
				this.universe.nav(dx < 0 ? 1 : -1, origin.index);
				return;
			}
			const direction =
				Math.abs(point.x) > Math.abs(point.y)
					? point.x < 0
						? 'left'
						: 'right'
					: point.y < 0
						? 'down'
						: 'up';
			this.dispatch('tap', direction, event);
		}

		bind(bindings) {
			for (const [name, binding] of Object.entries(bindings))
				this.#bindings.set(name, binding);
			return this;
		}

		dispatch(name, phase, value) {
			const binding = this.#bindings.get(name);
			if (!binding) return false;

			if (typeof binding === 'function') {
				if (phase !== 'end') binding(value);
			} else {
				binding[phase]?.(value);
			}
			return true;
		}
	}

	pathless.universe = new Universe(pathless);
	pathless.input = new Input(pathless.universe).bind({
		1: () => pathless.universe.select(0),
		2: () => pathless.universe.select(1),
		3: () => pathless.universe.select(2),
		tab: () => pathless.universe.focus(),
		q: () => pathless.universe.nav(-1),
		e: () => pathless.universe.nav(1),
	});
	pathless.universe.sync();
</script>
