<div id="zero" class="space"></div>
<div id="one" class="space"></div>
<div id="two" class="space"></div>
<div id="three" class="space"></div>

<script>
	class Universe {
		#previous = null;
		#rendering = null;
		constructor() {
			this.el = pathless.el;
			const space = (id) => ({
				el: document.getElementById(id),
				frame: 0,
				states: [],
				bindings: {},
			});
			this.spaces = ['zero', 'one', 'two'].map(space);
			this.panel = space('three');
			this.pointer = new Pointer(this);
			this.#measure();
			const observer = new ResizeObserver(() => this.#measure());
			observer.observe(this.el, { box: 'border-box' });
		}

		#measure() {
			const { width, height } = this.el.getBoundingClientRect();
			this.width = width;
			this.height = height;
			for (const space of this.visible) {
				const { left, top, width, height } =
					space.el.getBoundingClientRect();
				space.center = {
					x: (left + width / 2) / (this.width / 2) - 1,
					y: 1 - (top + height / 2) / (this.height / 2),
				};
			}
		}

		get space() {
			return this.#rendering ?? this.spaces[pathless.el.dataset.focused];
		}
		get frame() {
			const { el, states, frame } = this.space;
			return {
				el: el.firstElementChild,
				state: (states[frame] ??= new Map()),
			};
		}
		get visible() {
			const { layout, focused } = pathless.el.dataset;
			const [zero, one, two] = this.spaces;
			const visible =
				layout === '0'
					? [this.spaces[focused]]
					: layout === '1'
						? [zero, focused === '2' ? two : one]
						: this.spaces;
			return pathless.el.classList.contains('panel')
				? [...visible, this.panel]
				: visible;
		}

		set focused(space) {
			const index = this.spaces.indexOf(space);
			if (index < 0) return;
			pathless.el.dataset.focused = index;
			this.#measure();
			this.sync();
		}

		sync(...spaces) {
			if (!spaces.length)
				spaces = this.visible.filter(({ el }) => !el.firstElementChild);
			for (const space of spaces) {
				const frames =
					space === this.panel ? pathless.panels : pathless.frames;
				if (!frames.length) continue;
				this.#rendering = space;
				try {
					space.bindings = {};
					pathless.exec(space.el, frames[space.frame].data);
				} finally {
					this.#rendering = null;
				}
			}
		}

		#cycle(index, direction, length) {
			return (((index + direction) % length) + length) % length;
		}

		navigate(direction, space = this.space) {
			const frames =
				space === this.panel ? pathless.panels : pathless.frames;
			if (!frames.length) return;
			space.frame = this.#cycle(space.frame, direction, frames.length);
			this.sync(space);
		}

		layout(l, v) {
			const { dataset } = pathless.el;
			const layout = Number(dataset.layout);
			l ??= layout;
			v ??= l === layout ? Number(dataset.variant) + 1 : 0;
			if (l === 0) {
				if (layout === 0) {
					if (!this.#previous) return;
					[l, v] = this.#previous;
				} else {
					this.#previous = [layout, Number(dataset.variant)];
					v = 0;
				}
			}
			if (l) v = this.#cycle(v, 0, 2 ** l);
			dataset.layout = l;
			dataset.variant = v;
			this.#measure();
			this.sync();
		}

		focus(direction = 1, space = this.space) {
			const visible = this.visible.filter(
				(space) => space !== this.panel,
			);
			const index = visible.indexOf(space);
			this.focused =
				index < 0
					? visible.at(direction < 0 ? -1 : 0)
					: visible[this.#cycle(index, direction, visible.length)];
		}

		togglePanel() {
			if (!pathless.panels.length) return;
			pathless.el.classList.toggle('panel');
			this.#measure();
			this.sync();
		}
	}

	class Pointer {
		state = null;

		constructor(universe) {
			this.universe = universe;
			this.x = (first, second) => {
				this.universe.space.bindings.x = [first, second];
			};
			this.y = (first, second) => {
				this.universe.space.bindings.y = [first, second];
			};
			for (const [type, method] of [
				['pointerdown', 'down'],
				['pointerup', 'up'],
				['pointercancel', 'cancel'],
				['lostpointercapture', 'cancel'],
			]) {
				pathless.el.addEventListener(type, (event) =>
					this[method](event),
				);
			}
		}

		down(event) {
			if (!event.isPrimary || event.button !== 0 || this.state) return;
			const visible = this.universe.visible;
			const space = visible.find(({ el }) => el.contains(event.target));
			if (!space) return;
			if (visible.length > 1 && space !== this.universe.space)
				this.universe.focused = space;
			pathless.el.setPointerCapture(event.pointerId);
			this.state = {
				id: event.pointerId,
				start: this.coordinate(event),
				space,
			};
		}

		up(event) {
			const pointer = this.state;
			if (!pointer || pointer.id !== event.pointerId) return;
			if (
				event.defaultPrevented ||
				!this.universe.visible.includes(pointer.space)
			) {
				this.cancel(event);
				return;
			}
			const end = this.coordinate(event);
			this.output(pointer.start, end);
		}

		cancel(event) {
			if (this.state?.id === event.pointerId) this.state = null;
		}

		coordinate(point) {
			const { width, height } = this.universe;
			return {
				x: point.clientX / (width / 2) - 1,
				y: 1 - point.clientY / (height / 2),
			};
		}

		output(start, end) {
			const deltaX = Math.abs(end.x - start.x);
			const deltaY = Math.abs(end.y - start.y);
			const { space } = this.state;
			const { bindings, center } = space;
			this.state = null;
			if (Math.max(deltaX, deltaY) >= 0.1) {
				if (deltaX >= deltaY)
					this.universe.navigate(end.x < start.x ? -1 : 1, space);
			} else if (
				Math.min(Math.abs(start.x), Math.abs(start.y)) <= 0.05 &&
				Math.min(Math.abs(end.x), Math.abs(end.y)) <= 0.05
			) {
				this.universe.togglePanel();
			} else {
				const offsetX = end.x - center.x;
				const offsetY = end.y - center.y;
				const callback =
					Math.abs(offsetX) >= Math.abs(offsetY)
						? bindings.x?.[offsetX < 0 ? 0 : 1]
						: bindings.y?.[offsetY < 0 ? 1 : 0];
				callback?.(start, end, space);
			}
		}
	}
	pathless.universe = new Universe();
</script>
