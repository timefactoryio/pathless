<div id="zero" class="space"></div>
<div id="one" class="space"></div>
<div id="two" class="space"></div>

<script>
	class Universe {
		#rendering = null;

		constructor() {
			this.el = document.getElementById('universe');
			this.spaces = ['zero', 'one', 'two'].map((id) => ({
				el: document.getElementById(id),
				frame: 0,
				state: [],
			}));
			this.layouts = [null, this.spaces.slice(0, 2), this.spaces.slice()];
			this.variants = [1, 2, 4];
			this.previous = null;
			this.state = [0, 0, 0]; // layout, variant, focused
			this.stateLength = [3, 4, 3];
			this.input = new Input(this);
		}

		get l() {
			return Number(this.el.dataset.layout);
		}
		set l(value) {
			this.el.dataset.layout = value;
		}
		get v() {
			return Number(this.el.dataset.variant);
		}
		set v(value) {
			this.el.dataset.variant = value;
		}

		get active() {
			return Number(this.el.dataset.focused);
		}
		set active(index) {
			this.el.dataset.focused = index;
		}
		get space() {
			return this.#rendering ?? this.spaces[this.active];
		}
		set space(space) {
			this.active = this.spaces.indexOf(space);
		}
		get visible() {
			if (!this.l) return [this.space];
			if (this.l === 1 && this.space === this.spaces[2])
				return [this.spaces[0], this.space];
			return this.layouts[this.l];
		}
		get frame() {
			return this.space.el.querySelector('div');
		}

		move(index, direction, length, wrap = true) {
			const next = index + direction;
			return wrap
				? ((next % length) + length) % length
				: Math.max(0, Math.min(next, length - 1));
		}

		read() {
			return (this.space.state[this.space.frame] ??= new Map());
		}

		write(key, value) {
			this.read().set(key, value);
		}

		pin() {
			const state = this.read();
			return {
				read: () => state,
				write: (key, value) => state.set(key, value),
			};
		}

		sync(space) {
			const visible = this.visible;
			if (!visible.includes(this.space)) this.space = visible[0];
			if (!pathless.frames?.length) return;
			try {
				for (const current of space ? [space] : visible) {
					this.#rendering = current;
					this.input.clear(current);
					pathless.exec(current.el, pathless.frames[current.frame]);
				}
			} finally {
				this.#rendering = null;
			}
		}

		nav(step) {
			return (space = this.space) => {
				if (!pathless.frames?.length) return;
				space.frame = this.move(
					space.frame,
					step,
					pathless.frames.length,
				);
				this.sync(space);
				return space.frame;
			};
		}

		syncLayout(layout = 0, variant = 0, wrap = true) {
			const previous = [this.l, this.v];
			this.l = this.move(this.l, layout, this.layouts.length, wrap);
			this.v = this.move(this.v, variant, this.variants[this.l], wrap);
			if (previous[0] !== this.l) this.previous = previous;
			this.sync();
			return [this.l, this.v];
		}

		layout(step = 1, wrap = true) {
			return (space = this.space) => {
				this.space = space;
				return this.syncLayout(step, 0, wrap);
			};
		}

		variant(step = 1, wrap = true) {
			return () => this.syncLayout(0, step, wrap);
		}

		focus(step = 1) {
			const visible = this.visible;
			this.space =
				visible[
					this.move(visible.indexOf(this.space), step, visible.length)
				];
			return this.active;
		}
	}
</script>
