<div id="zero" class="space"></div>
<div id="one" class="space"></div>
<div id="two" class="space"></div>
<div id="panel" class="space" hidden></div>

<script>
	class Universe {
		#plane;
		#previous = null;
		#rendering = null;
		constructor(pathless) {
			this.pathless = pathless;
			this.el = document.getElementById('universe');
			this.#plane = this.el.getBoundingClientRect();
			new ResizeObserver(
				() => (this.#plane = this.el.getBoundingClientRect()),
			).observe(this.el);
			this.spaces = Array.from(
				this.el.querySelectorAll(':scope > .space'),
				(el, index) => ({
					el,
					frame: 0,
					states: [],
					bindings: {},
					frames: index === 3 ? pathless.panels : pathless.frames,
				}),
			);
			this.panel = this.spaces[3];
			this.input = new Input(this);
		}

		get #state() {
			const { layout, variant, focused } = this.el.dataset;
			return [layout, variant, focused].map(Number);
		}
		get space() {
			return this.#rendering ?? this.spaces[this.#state[2]];
		}
		get frame() {
			return this.space.el.querySelector(':scope > div');
		}
		get previous() {
			return this.#previous;
		}
		get visible() {
			return this.spaces
				.slice(0, 3)
				.filter(({ el }) => el.offsetParent !== null);
		}
		set view([layout, variant]) {
			this.el.dataset.layout = layout;
			this.el.dataset.variant = variant;
			this.sync();
		}

		set focused(space) {
			this.el.dataset.focused = this.spaces.indexOf(space);
		}

		coordinate({ clientX, clientY }) {
			const { left, top, width, height } = this.#plane;
			return {
				x: (2 * (clientX - left)) / (width || 1) - 1,
				y: 1 - (2 * (clientY - top)) / (height || 1),
			};
		}

		state() {
			const space = this.space;
			return (space.states[space.frame] ??= new Map());
		}

		sync(space) {
			try {
				for (const current of space ? [space] : this.visible) {
					this.#rendering = current;
					current.bindings = {};
					this.pathless.exec(
						current.el,
						current.frames[current.frame],
					);
				}
			} finally {
				this.#rendering = null;
			}
		}

		togglePanel() {
			if (!this.panel.frames.length) return false;
			this.panel.el.hidden = !this.panel.el.hidden;
			if (!this.panel.el.hidden && !this.panel.el.firstElementChild)
				this.sync(this.panel);
			return !this.panel.el.hidden;
		}

		#cycle(index, direction, length) {
			return (index + direction + length) % length;
		}

		navigate(direction) {
			const space = this.space;
			const frame = this.#cycle(
				space.frame,
				direction,
				this.pathless.frames.length,
			);
			space.frame = frame;
			this.sync(space);
			return frame;
		}

		layout(layout) {
			const [current, variant] = this.#state;
			let next = 0;
			if (layout === 0) {
				if (current > 0) this.#previous = [current, variant];
				else if (this.#previous) [layout, next] = this.#previous;
				else return;
			} else {
				next = current === layout ? (variant + 1) % 2 ** layout : 0;
				this.#previous = [layout, next];
			}
			const view = [layout, next];
			this.view = view;
			return view;
		}

		focus(direction = 1) {
			const visible = this.visible;
			const current = this.space;
			if (visible.length < 2) return current;
			const next =
				visible[
					this.#cycle(
						visible.indexOf(current),
						direction,
						visible.length,
					)
				];
			this.focused = next;
			return next;
		}
	}

	class Input {
		constructor(universe) {
			this.universe = universe;
			this.keyboard = new Keyboard(this);
			this.pointer = new Pointer(this);
		}

		command(direction) {
			this.universe.space.bindings[direction]?.();
		}

		#bind(direction, callback) {
			this.universe.space.bindings[direction] = callback;
			return this.universe;
		}

		up(callback) {
			return this.#bind('up', callback);
		}

		down(callback) {
			return this.#bind('down', callback);
		}

		left(callback) {
			return this.#bind('left', callback);
		}

		right(callback) {
			return this.#bind('right', callback);
		}
	}

	class Keyboard {
		#keys;

		constructor(input) {
			const { universe } = input;
			const tap = (direction) => () => input.command(direction);
			this.#keys = {
				1: () => universe.layout(0),
				2: () => universe.layout(1),
				3: () => universe.layout(2),
				tab: () => universe.focus(),
				q: () => universe.navigate(-1),
				e: () => universe.navigate(1),
				z: () => universe.togglePanel(),
				w: tap('up'),
				a: tap('left'),
				s: tap('down'),
				d: tap('right'),
			};
			window.addEventListener('keydown', this);
		}

		handleEvent(event) {
			this[event.type](event);
		}

		keydown(event) {
			const key = event.key.toLowerCase();
			if (key === 'tab') event.preventDefault();
			this.#keys[key]?.();
		}
	}

	class Pointer {
		#commands;
		#pointers = new Map();

		constructor(input) {
			this.input = input;
			const { universe } = input;
			const tap = (direction) => () => input.command(direction);
			this.#commands = {
				'tap.up': tap('up'),
				'tap.down': tap('down'),
				'tap.left': tap('left'),
				'tap.right': tap('right'),
				'swipe.left': () => universe.navigate(-1),
				'swipe.right': () => universe.navigate(1),
				'scale.down': () => {
					const layout = Number(universe.el.dataset.layout);
					if (layout < 2) universe.layout(layout + 1);
				},
				'scale.up': () => {
					if (Number(universe.el.dataset.layout)) universe.layout(0);
				},
			};
			for (const type of ['pointerdown', 'pointerup', 'pointercancel'])
				universe.el.addEventListener(type, this);
			let lastTap = 0;
			universe.el.addEventListener(
				'touchend',
				(event) => {
					const now = Date.now();
					if (now - lastTap < 300) event.preventDefault();
					lastTap = now;
				},
				{ passive: false },
			);
		}

		handleEvent(event) {
			this[event.type](event);
		}

		pointerdown(event) {
			if (this.#pointers.size === 2) return;
			this.#pointers.set(event.pointerId, {
				start: this.input.universe.coordinate(event),
			});
			event.currentTarget.setPointerCapture(event.pointerId);
		}

		pointerup(event) {
			const pointer = this.#pointers.get(event.pointerId);
			if (!pointer) return;
			pointer.end = this.input.universe.coordinate(event);
			if (![...this.#pointers.values()].every(({ end }) => end)) return;
			const { type, direction } = this.points();
			this.#pointers.clear();
			this.#commands[`${type}.${direction}`]?.();
		}

		pointercancel() {
			this.#pointers.clear();
		}

		points() {
			const [first, second] = this.#pointers.values();
			const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
			if (second) {
				return {
					type: 'scale',
					direction:
						distance(first.end, second.end) <
						distance(first.start, second.start)
							? 'down'
							: 'up',
				};
			}
			const { start, end } = first;
			const tap = distance(start, end) < 0.25;
			const point = {
				x: tap ? end.x : end.x - start.x,
				y: tap ? end.y : end.y - start.y,
			};
			const axis = Math.abs(point.x) >= Math.abs(point.y) ? 'x' : 'y';
			const directions = { x: ['left', 'right'], y: ['down', 'up'] };
			return {
				type: tap ? 'tap' : 'swipe',
				direction: directions[axis][point[axis] < 0 ? 0 : 1],
			};
		}
	}
</script>
