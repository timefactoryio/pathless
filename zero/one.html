<div id="zero" class="space"></div>
<div id="one" class="space"></div>
<div id="two" class="space"></div>
<div id="three" class="space"></div>

<script>
	class Universe {
		#previous = null;
		#rendering = null;
		constructor(frames, panels) {
			this.frames = frames;
			this.panels = panels;
			const space = (id) => ({
				el: document.getElementById(id),
				frame: 0,
				states: [],
			});
			this.spaces = ['zero', 'one', 'two'].map(space);
			this.panel = space('three');
		}

		get space() {
			return this.#rendering ?? this.spaces[pathless.el.dataset.focused];
		}
		get frame() {
			const { el, states, frame } = this.space;
			return {
				el: el.firstElementChild,
				state: (states[frame] ??= new Map()),
			};
		}
		get visible() {
			const { layout, focused } = pathless.el.dataset;
			const [zero, one, two] = this.spaces;
			if (layout === '0') return [this.spaces[focused]];
			if (layout === '1') return [zero, focused === '2' ? two : one];
			return this.spaces;
		}

		set focused(space) {
			const index = this.spaces.indexOf(space);
			if (index < 0) return;
			pathless.el.dataset.focused = index;
			this.sync();
		}

		sync(...spaces) {
			for (const space of spaces.length ? spaces : this.visible) {
				const frames = space === this.panel ? this.panels : this.frames;
				if (
					!frames.length ||
					(!spaces.length && space.el.firstElementChild)
				)
					continue;
				this.#rendering = space;
				try {
					pathless.exec(space.el, frames[space.frame].data);
				} finally {
					this.#rendering = null;
				}
			}
		}

		#cycle(index, direction, length) {
			return (((index + direction) % length) + length) % length;
		}

		navigate(direction, space = this.space) {
			const frames = space === this.panel ? this.panels : this.frames;
			if (!frames.length) return;
			space.frame = this.#cycle(space.frame, direction, frames.length);
			this.sync(space);
		}

		layout(l, v) {
			const { dataset } = pathless.el;
			const layout = Number(dataset.layout);
			l ??= layout;
			v ??= l === layout ? Number(dataset.variant) + 1 : 0;
			if (l === 0) {
				if (layout === 0) {
					if (!this.#previous) return;
					[l, v] = this.#previous;
				} else {
					this.#previous = [layout, Number(dataset.variant)];
					v = 0;
				}
			}
			if (l) v = this.#cycle(v, 0, 2 ** l);
			dataset.layout = l;
			dataset.variant = v;
			this.sync();
		}

		focus(direction = 1, space = this.space) {
			const visible = this.visible;
			const index = visible.indexOf(space);
			this.focused =
				index < 0
					? visible.at(direction < 0 ? -1 : 0)
					: visible[this.#cycle(index, direction, visible.length)];
		}

		togglePanel() {
			if (!this.panels.length) return;
			const panel = this.panel;
			if (
				pathless.el.classList.toggle('panel') &&
				!panel.el.firstElementChild
			)
				this.sync(panel);
		}

		coordinate({ clientX, clientY }) {
			const target = document.elementFromPoint(clientX, clientY);
			return {
				x: (clientX * 2) / pathless.width - 1,
				y: 1 - (clientY * 2) / pathless.height,
				space: this.panel.el.contains(target)
					? this.panel
					: this.spaces.find(({ el }) => el.contains(target)),
			};
		}

		displacement(start, end) {
			const delta = { x: end.x - start.x, y: end.y - start.y };
			const swipe = Math.abs(delta.x) + Math.abs(delta.y) >= 0.1;
			const point = swipe ? delta : end;
			const horizontal = Math.abs(point.x);
			const vertical = Math.abs(point.y);
			return {
				space: start.space,
				tap: !swipe,
				swipe,
				direction:
					horizontal + vertical < 0.1
						? 'origin'
						: horizontal >= vertical
							? point.x >= 0
								? 'right'
								: 'left'
							: point.y >= 0
								? 'up'
								: 'down',
			};
		}
	}
</script>
