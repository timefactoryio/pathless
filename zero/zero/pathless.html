<!doctype html>
<html lang="en">
	<head>
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no" />
		<title>hello.universe</title>
		<style>
			:root {
				--b: 1px solid blue;
			}
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				user-select: none;
				-webkit-user-select: none;
			}
			[hidden] {
				display: none !important;
			}
			body {
				height: 100dvh;
				overflow: hidden;
				font-family: sans-serif;
				background: #000;
				color: #fff;
				display: flex;
				flex-direction: column;
				border: var(--b);
				border-radius: 5px;
			}
			body,
			:is(#zero, #one, #two),
			#panel {
				touch-action: none;
				overscroll-behavior: none;
			}
			#universe {
				flex: 1;
				min-height: 0;
				display: flex;
			}
			:is(#zero, #one, #two) {
				flex: 1;
				overflow: hidden;
				position: relative;
				isolation: isolate;
				display: flex;
				flex-direction: column;
			}
			:is(#zero, #one, #two) > * {
				width: 100%;
			}
			:is(#zero, #one, #two) > :first-child {
				flex: 1;
				min-height: 0;
			}
			#zero {
				grid-area: zero;
				container: zero / size;
			}
			#one {
				grid-area: one;
				container: one / size;
			}
			#two {
				grid-area: two;
				container: two / size;
			}
			#universe[data-layout='1'][data-variant='1'] {
				flex-direction: column;
			}
			#universe[data-layout='2'] {
				display: grid;
				grid-template-columns: 1fr 1fr;
				grid-template-rows: 1fr 1fr;
			}
			#universe[data-layout='2'][data-variant='0'] {
				grid-template-areas: 'zero one' 'zero two';
			}
			#universe[data-layout='2'][data-variant='1'] {
				grid-template-areas: 'zero zero' 'two  one';
			}
			#universe[data-layout='2'][data-variant='2'] {
				grid-template-areas: 'two  zero' 'one   zero';
			}
			#universe[data-layout='2'][data-variant='3'] {
				grid-template-areas: 'one   two' 'zero zero';
			}
			#universe:not([data-layout='0'])[data-variant='0'] #zero {
				border-right: var(--b);
			}
			#universe:not([data-layout='0'])[data-variant='1'] #zero {
				border-bottom: var(--b);
			}
			#universe[data-layout='2'][data-variant='2'] #zero {
				border-left: var(--b);
			}
			#universe[data-layout='2'][data-variant='3'] #zero {
				border-top: var(--b);
			}
			#universe[data-layout='2'][data-variant='0'] #one {
				border-bottom: var(--b);
			}
			#universe[data-layout='2'][data-variant='1'] #one {
				border-left: var(--b);
			}
			#universe[data-layout='2'][data-variant='2'] #one {
				border-top: var(--b);
			}
			#universe[data-layout='2'][data-variant='3'] #one {
				border-right: var(--b);
			}
			#panel {
				height: 15vh;
				border-top: var(--b);
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 0.5em;
			}
		</style>
		<script>
			window.circuit = '{{.CIRCUIT}}'.replace(
				'localhost',
				location.hostname,
			);
			class Pathless {
				static #td = new TextDecoder();
				static #range = document.createRange();

				// decode walks bytes once, sequentially; a node's own name/type are resolved by
				// its parent's dictionaries, so the root's are read once up front instead.
				static decode(bytes) {
					let p = 0;
					const uv = () => {
						let r = 0,
							s = 0,
							b;
						do {
							b = bytes[p++];
							r |= (b & 0x7f) << s;
							s += 7;
						} while (b & 0x80);
						return r >>> 0;
					};
					const fld = () => bytes.slice(p, (p += uv())); // copy out — don't pin the whole payload in memory
					const str = () => Pathless.#td.decode(fld());
					const dict = () => Array.from({ length: uv() }, str);

					const node = (name, type) => {
						if (type !== '') {
							const zero = fld();
							uv();
							return { name, type, zero };
						}

						const names = dict();
						const types = dict();
						const one = Array.from({ length: uv() }, () =>
							node(
								names.length > 1 ? names[uv()] : names[0],
								types.length > 1 ? types[uv()] : types[0],
							),
						);

						return name ? { name, one } : { one };
					};

					return node(str(), str());
				}

				constructor() {
					this.cache = new Map();
					this.init();
				}

				source(path) {
					let value = this.cache.get(path);
					if (!value) {
						value = fetch(`${window.circuit}/${path}`)
							.then(async (response) =>
								Pathless.decode(
									new Uint8Array(
										await response.arrayBuffer(),
									),
								),
							)
							.catch((error) => {
								this.cache.delete(path);
								throw error;
							});
						this.cache.set(path, value);
					}
					return value;
				}

				url(entry) {
					let value = this.cache.get(entry);
					if (!value) {
						value = URL.createObjectURL(
							new Blob([entry[2]], { type: entry[1] }),
						);
						this.cache.set(entry, value);
					}
					return value;
				}

				exec(el, data) {
					el.replaceChildren(
						Pathless.#range.createContextualFragment(
							Pathless.#td.decode(data),
						),
					);
				}

				async init() {
					const {
						one: [universe, frames, panels],
					} = await this.source('');

					this.frames = frames.one.map(({ zero }) => zero);
					this.panels = panels.one.map(({ zero }) => zero);
					this.exec(
						document.getElementById('universe'),
						universe.zero,
					);
					this.universe.init();
				}
			}
			document.addEventListener('DOMContentLoaded', () => {
				window.pathless = new Pathless();
			});
		</script>
	</head>
	<body>
		<div id="universe" data-layout="0" data-variant="0"></div>
		<div id="panel" hidden></div>
	</body>
</html>
