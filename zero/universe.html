<div id="zero" class="space" hidden></div>
<div id="one" class="space" hidden></div>
<div id="two" class="space" hidden></div>
<div id="three" class="space" hidden></div>

<script>
	class Universe {
		spaces = Array.from(pathless.el.querySelectorAll(':scope > .space'));
		#layouts = [1, 2, 3].map((count) => this.spaces.slice(0, count));
		#layout = [0, 0, null];
		#visible = this.#layouts[0];
		#focused = this.spaces[0];
		#contexts = new Map(
			this.spaces.map((space) => [
				space,
				{ index: 0, states: new Map() },
			]),
		);
		#rendering = null;

		constructor() {
			pathless.universe = this;
			this.#focused.hidden = false;
			this.#exec(this.#focused, pathless.frames[0].data);
		}
		get focused() {
			return this.#focused;
		}
		frame(space = this.#rendering ?? this.#focused) {
			const { index, states } = this.#contexts.get(space);
			if (!states.has(index)) states.set(index, new Map());
			return { el: space.firstElementChild, state: states.get(index) };
		}
		layout(layout, space) {
			let [current, variant, previous] = this.#layout;
			if (layout === 0 && current === 0 && space === undefined) {
				if (!previous) return this;
				[layout, variant] = previous;
			} else {
				if (layout === 0 && current !== 0)
					previous = [current, variant];
				variant = layout === current ? (variant + 1) % 2 ** layout : 0;
			}
			this.#layout = [layout, variant, previous];
			Object.assign(pathless.el.dataset, { layout, variant });
			if (layout === current && layout !== 0) return this;
			return this.#show(
				layout === 0 ? [space ?? this.#focused] : this.#layouts[layout],
			);
		}
		focus(direction = 1) {
			const index = this.#visible.indexOf(this.#focused) + direction;
			const length = this.#visible.length;
			this.#focused = this.#visible[((index % length) + length) % length];
			return this;
		}
		panel(visible = this.spaces[3].hidden) {
			const panel = this.spaces[3];
			if (panel.hidden === !visible) return this;
			panel.hidden = !visible;
			return this.#show(this.#visible);
		}
		navigate(direction = 1, space = this.#focused) {
			const frames =
				space === this.spaces[3] ? pathless.panels : pathless.frames;
			if (!frames.length) return this;
			const context = this.#contexts.get(space);
			const index = context.index + direction;
			context.index =
				((index % frames.length) + frames.length) % frames.length;
			return this.#exec(space, frames[context.index].data);
		}
		#exec(space, data) {
			const rendering = this.#rendering;
			this.#rendering = space;
			try {
				pathless.exec(space, data);
			} finally {
				this.#rendering = rendering;
			}
			return this;
		}
		#show(spaces) {
			const panel = this.spaces[3];
			spaces = spaces.filter((space) => space !== panel);
			if (!panel.hidden) spaces.push(panel);
			if (!spaces.length) spaces.push(this.spaces[0]);
			this.#visible = spaces;
			if (!spaces.includes(this.#focused)) this.#focused = spaces[0];
			this.spaces.forEach((space) => {
				space.hidden = !spaces.includes(space);
			});
			return this;
		}
	}
	new Universe();
</script>
