<div id="zero" class="space"></div>
<div id="one" class="space" hidden></div>
<div id="two" class="space" hidden></div>
<div id="three" class="space" hidden></div>

<script>
	class Universe {
		#layouts = [
			{ variants: 1, spaces: 1 },
			{ variants: 2, spaces: 2 },
			{ variants: 4, spaces: 3 },
		];
		#state = {
			layout: [0, 0],
			spaces: [0],
			focused: 0,
			previousLayout: null,
		};
		constructor() {
			this.spaces = Array.from(
				pathless.el.querySelectorAll(':scope > .space'),
				(el, index) => ({
					el,
					frames: index === 3 ? pathless.panels : pathless.frames,
					frame: 0,
					states: [],
				}),
			);
			this.sync();
		}
		layout(layout) {
			const state = this.#state;
			const { spaces, focused, layout: current } = state;
			if (layout === current[0] && layout !== 0) {
				state.layout = [
					layout,
					this.#wrap(current[1] + 1, this.#layouts[layout].variants),
				];
				this.sync();
				return state;
			}
			const next =
				layout === 0 && current[0] === 0
					? state.previousLayout
					: [layout, 0];
			if (!next) return state;
			if (next[0] === 0) state.previousLayout = [...current];
			const main = focused === 3 ? spaces[0] : focused;
			spaces.splice(0, this.#layouts[current[0]].spaces);
			for (let index = 0; index < this.#layouts[next[0]].spaces; index++)
				spaces.splice(index, 0, next[0] === 0 ? main : index);
			state.layout = [...next];
			if (!spaces.includes(focused)) state.focused = spaces[0];
			this.sync();
			return state;
		}
		focus(direction = 1) {
			const state = this.#state;
			const { spaces, focused } = state;
			const index = this.#wrap(
				spaces.indexOf(focused) + direction,
				spaces.length,
			);
			state.focused = spaces[index];
			return state;
		}
		frames(direction = 1) {
			const state = this.#state;
			const space = this.spaces[state.focused];
			if (space.frames.length)
				space.frame = this.#wrap(
					space.frame + direction,
					space.frames.length,
				);
			this.sync();
			return state;
		}
		panel(visible = !this.#state.spaces.includes(3)) {
			const state = this.#state;
			const { spaces, focused } = state;
			if (visible === spaces.includes(3)) return state;
			if (visible) spaces.push(3);
			else {
				spaces.pop();
				if (focused === 3) state.focused = spaces[0];
			}
			this.sync();
			return state;
		}
		sync() {
			const {
				layout: [layout, variant],
				spaces,
			} = this.#state;
			Object.assign(pathless.el.dataset, { layout, variant });
			this.spaces.forEach((space, index) => {
				space.el.hidden = !spaces.includes(index);
				if (space.el.hidden || space.mounted === space.frame) return;
				const frame = space.frames[space.frame];
				if (!frame) return;
				pathless.exec(space.el, frame.data);
				space.mounted = space.frame;
			});
			return this.#state;
		}
		#wrap(value, length) {
			return ((value % length) + length) % length;
		}
	}
	new Universe();
</script>
