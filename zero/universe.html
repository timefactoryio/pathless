<div id="zero" class="space" hidden></div>
<div id="one" class="space" hidden></div>
<div id="two" class="space" hidden></div>
<div id="three" class="space" hidden></div>

<script>
	class Universe {
		#visible;
		#layouts = [[0], [0, 1], [0, 1, 2, 3]];
		#layout = 0;
		#restore = null;

		#space(id) {
			return {
				el: document.getElementById(id),
				frame: 0,
				states: [],
			};
		}
		constructor() {
			this.el = pathless.el;
			this.zero = this.#space('zero');
			this.one = this.#space('one');
			this.two = this.#space('two');
			this.three = this.#space('three');
			this.spaces = [this.zero, this.one, this.two, this.three];
			this.#visible = [this.zero];
			this.sync();
		}
		get space() {
			return this.#visible[0];
		}
		set space(space) {
			this.#select(this.#visible, space);
		}
		get visible() {
			return [...this.#visible];
		}
		set visible(spaces) {
			const order = [...this.spaces];
			this.#select(order, this.space);
			const visible = order.filter((space) => spaces.includes(space));
			if (visible.length) this.#visible = visible;
		}
		get layout() {
			return {
				layout: this.#layout,
				variant: this.#layouts[this.#layout][0],
			};
		}
		layouts(layout = this.#layout, variant) {
			if (layout === 0 && this.#layout === 0) layout = this.#restore;
			const variants = this.#layouts[layout];
			if (!variants) return;
			if (layout === 0) this.#restore = this.#layout;
			variant ??= variants[0] + (layout === this.#layout ? 1 : 0);
			this.#layout = layout;
			this.#select(variants, this.#cycle(variant, 0, variants.length));
			this.sync();
		}
		sync(changed) {
			const main = this.#visible.find((space) => space !== this.three);
			const mains = [
				[main],
				[this.zero, main === this.two ? this.two : this.one],
				[this.zero, this.one, this.two],
			][this.#layout];
			this.visible = this.#visible.includes(this.three)
				? [...mains, this.three]
				: mains;
			Object.assign(this.el.dataset, this.layout);
			for (const space of this.spaces) {
				const shown = this.#visible.includes(space);
				const area = mains.indexOf(space);
				if (area >= 0)
					space.el.style.gridArea = this.spaces[area].el.id;
				if (space === changed || (shown && !space.el.firstElementChild))
					this.exec(space);
				space.el.hidden = !shown;
			}
		}
		focus(direction) {
			const index = this.#cycle(0, direction, this.#visible.length);
			this.space = this.#visible[index];
		}
		togglePanel() {
			const visible = this.visible;
			this.visible = visible.includes(this.three)
				? visible.filter((space) => space !== this.three)
				: [...visible, this.three];
			this.sync();
		}
		frames(space, direction) {
			const { length } = this.#source(space);
			if (!length) return;
			space.frame = this.#cycle(space.frame, direction, length);
			this.sync(space);
		}
		exec(space) {
			const one = this.#source(space)[space.frame];
			if (!one) return;
			pathless.exec(space.el, one.data);
		}
		#source(space) {
			return space === this.three ? pathless.panels : pathless.frames;
		}
		#select(items, item) {
			const index = items.indexOf(item);
			if (index > 0) items.push(...items.splice(0, index));
		}
		#cycle(index, direction, length) {
			return (((index + direction) % length) + length) % length;
		}
	}
	new Universe();
</script>
