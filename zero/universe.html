<script>
	class Universe {
		spaces = pathless.spaces;
		#layouts = [1, 2, 3].map((count) => this.spaces.slice(0, count));
		#layout = [0, 0, null];
		#visible = this.#layouts[0];
		#focused = this.spaces[0];
		#contexts = new Map(
			this.spaces.map((space) => [
				space,
				{ index: 0, states: new Map() },
			]),
		);
		#rendering = null;

		constructor() {
			for (const name of [
				'frame',
				'layout',
				'focus',
				'panel',
				'navigate',
			]) {
				pathless[name] = this[name].bind(this);
			}
			this.#focused.hidden = false;
			this.#measure();
			const observer = new ResizeObserver(() => this.#measure());
			for (const space of this.spaces)
				observer.observe(space, { box: 'border-box' });
			this.#exec(this.#focused, pathless.frames[0].data);
		}
		frame(space = this.#rendering ?? this.#focused) {
			const { index, states } = this.#contexts.get(space);
			if (!states.has(index)) states.set(index, new Map());
			return {
				space,
				el: space.firstElementChild,
				state: states.get(index),
			};
		}
		layout(layout, space) {
			let [current, variant, previous] = this.#layout;
			const cycling = layout === current && layout !== 0;
			if (layout === 0 && current === 0 && space === undefined) {
				if (!previous) return pathless;
				[layout, variant] = previous;
			} else {
				if (layout === 0 && current !== 0)
					previous = [current, variant];
				variant = cycling ? (variant + 1) % 2 ** layout : 0;
			}
			this.#layout = [layout, variant, previous];
			Object.assign(pathless.el.dataset, { layout, variant });
			if (cycling) {
				this.#measure();
				return pathless;
			}
			return this.#show(
				layout === 0 ? [space ?? this.#focused] : this.#layouts[layout],
			);
		}
		focus(direction = 1, target = this.#focused) {
			const spaces = this.#visible.filter(
				(space) => space !== this.spaces[3],
			);
			const index = spaces.indexOf(target);
			if (index < 0) return pathless;
			const length = spaces.length;
			this.#focused =
				spaces[(((index + direction) % length) + length) % length];
			return pathless;
		}
		panel(visible = this.spaces[3].hidden) {
			const panel = this.spaces[3];
			if (panel.hidden === !visible) return pathless;
			panel.hidden = !visible;
			return this.#show(this.#visible);
		}
		navigate(direction = 1, space = this.#focused) {
			const frames =
				space === this.spaces[3] ? pathless.panels : pathless.frames;
			const { length } = frames;
			if (!length) return pathless;
			const ctx = this.#contexts.get(space);
			const index = ctx.index + direction;
			ctx.index = ((index % length) + length) % length;
			return this.#exec(space, frames[ctx.index].data);
		}
		#measure() {
			const { width: universeWidth, height: universeHeight } =
				pathless.el;
			for (const space of this.#visible) {
				const { left, top, width, height } =
					space.getBoundingClientRect();
				const origin = (space.origin ??= {});
				origin.x = (2 * (left + width / 2)) / universeWidth - 1;
				origin.y = 1 - (2 * (top + height / 2)) / universeHeight;
			}
		}
		#exec(space, data) {
			const rendering = this.#rendering;
			this.#rendering = space;
			try {
				pathless.exec(data, space);
			} finally {
				this.#rendering = rendering;
			}
			return pathless;
		}
		#show(spaces) {
			const panel = this.spaces[3];
			spaces = spaces.filter((space) => space !== panel);
			if (!spaces.length) spaces.push(this.spaces[0]);
			if (!panel.hidden) spaces.push(panel);
			this.#visible = spaces;
			this.spaces.forEach((space) => {
				space.hidden = !spaces.includes(space);
			});
			if (this.#focused.hidden) this.#focused = spaces[0];
			this.#measure();
			for (const space of spaces)
				if (!space.firstElementChild) this.navigate(0, space);
			return pathless;
		}
	}
	new Universe();
</script>
