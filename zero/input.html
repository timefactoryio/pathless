<script>
	class Input {
		#pointer = null;
		#triggers = new WeakMap();

		constructor() {
			for (const key of ['1', '2', '3'])
				this.#register(() => pathless.layout(Number(key) - 1), [key]);
			this.#register(() => pathless.focus(1), ['tab']);
			this.#register(
				(start, end, space) => pathless.navigate(-1, space),
				['q', 'swipe left'],
			);
			this.#register(
				(start, end, space) => pathless.navigate(1, space),
				['e', 'swipe right'],
			);
			this.#register(() => pathless.panel(), ['z', 'origin']);
			for (const [type, handler] of [
				['click', this.click],
				['pointerdown', this.down],
				['pointerup', this.up],
				['pointercancel', this.up],
				['lostpointercapture', this.up],
			]) {
				pathless.el.addEventListener(type, handler.bind(this));
			}
			document.addEventListener('keydown', this.keydown.bind(this));
			pathless.click = (el, callback) =>
				this.#register(callback, ['click'], el);
			pathless.x = this.x.bind(this);
			pathless.y = this.y.bind(this);
		}

		x(left, right) {
			const { el } = pathless.frame();
			this.#register(left, ['a', 'left'], el);
			return this.#register(right, ['d', 'right'], el);
		}
		y(up, down) {
			const { el } = pathless.frame();
			this.#register(up, ['w', 'up'], el);
			return this.#register(down, ['s', 'down'], el);
		}

		#register(callback, triggers = [], el = pathless.el) {
			let callbacks = this.#triggers.get(el);
			if (!callbacks) this.#triggers.set(el, (callbacks = new Map()));
			for (const trigger of triggers)
				callbacks.set(trigger.toLowerCase(), callback);
			return pathless;
		}
		#callback(trigger, space) {
			const el = space?.hidden ? null : space?.firstElementChild;
			return (
				this.#triggers.get(el)?.get(trigger) ??
				this.#triggers.get(pathless.el)?.get(trigger)
			);
		}

		down(event) {
			if (this.#blocked(event) || !event.isPrimary) return;
			if (event.button !== 0 || this.#pointer) return;
			const space = pathless.spaces.find(
				(space) => !space.hidden && space.contains(event.target),
			);
			if (!space) return;
			pathless.focus(0, space);
			if (this.#button(event.target)) return;
			this.#pointer = {
				...pathless.frame(space),
				id: event.pointerId,
				start: this.#coordinate(event),
			};
			pathless.el.setPointerCapture(event.pointerId);
		}
		up(event) {
			const pointer = this.#pointer;
			if (!pointer || pointer.id !== event.pointerId) return;
			this.#pointer = null;
			const { start, space, el } = pointer;
			if (event.type !== 'pointerup' || this.#blocked(event)) return;
			if (space.hidden || el !== space.firstElementChild) return;
			const end = this.#coordinate(event);
			const gesture = this.#gesture(start, end, space.origin);
			if (gesture) this.#callback(gesture, space)?.(start, end, space);
		}
		click(event) {
			if (event.defaultPrevented) return;
			const el = this.#button(event.target);
			if (el) this.#triggers.get(el).get('click').call(el, event);
		}
		keydown(event) {
			if (this.#blocked(event) || event.isComposing) return;
			if (event.ctrlKey || event.metaKey || event.altKey) return;
			const { space } = pathless.frame();
			const key = event.key.toLowerCase();
			const callback = this.#callback(key, space);
			if (!callback) return;
			event.preventDefault();
			callback(undefined, undefined, space);
		}

		#gesture(start, end, origin) {
			const deltaX = Math.abs(end[0] - start[0]);
			const deltaY = Math.abs(end[1] - start[1]);
			if (deltaY >= 0.1 && deltaY > deltaX) return null;
			if (deltaX >= 0.1)
				return end[0] < start[0] ? 'swipe left' : 'swipe right';
			if ([...start, ...end].every((value) => Math.abs(value) <= 0.05))
				return 'origin';
			const offsetX = end[0] - origin.x;
			const offsetY = end[1] - origin.y;
			if (Math.abs(offsetX) >= Math.abs(offsetY))
				return offsetX < 0 ? 'left' : 'right';
			return offsetY < 0 ? 'down' : 'up';
		}
		#blocked(event) {
			return (
				event.defaultPrevented ||
				event.target.isContentEditable ||
				event.target.closest?.('input, textarea, select')
			);
		}
		#button(el) {
			while (el && el !== pathless.el) {
				if (this.#triggers.get(el)?.has('click')) return el;
				el = el.parentElement;
			}
		}
		#coordinate({ clientX, clientY }) {
			const { width, height } = pathless.el;
			return [
				Math.max(-1, Math.min(1, (2 * clientX) / width - 1)),
				Math.max(-1, Math.min(1, 1 - (2 * clientY) / height)),
			];
		}
	}
	const input = new Input();
</script>
