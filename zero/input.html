<script>
	class Input {
		#bindings = new WeakMap();
		#controller;
		#observer;
		#pointers = new Map();
		#keys = new Set();
		#lastTouch = 0;

		constructor(universe) {
			this.universe = universe;
			this.delta = 0.2;
			this.tap = {
				x: this.#input('tap', 'x', { a: 'minus', d: 'plus' }),
				y: this.#input('tap', 'y', { s: 'minus', w: 'plus' }),
			};
			this.swipe = {
				x: this.#input(
					'swipe',
					'x',
					{ q: 'minus', e: 'plus' },
					universe.nav(-1),
					universe.nav(1),
				),
				y: this.#input('swipe', 'y'),
			};
			this.scale = {
				x: this.#input(
					'scale',
					'x',
					{},
					universe.variant(-1, false),
					universe.variant(1, false),
				),
				y: this.#input(
					'scale',
					'y',
					{},
					universe.layout(1, false),
					universe.layout(-1, false),
				),
			};
			this.events = {
				pointerdown: (event, space) =>
					this.#pointer('down', event, space),
				pointermove: (event, space) =>
					this.#pointer('move', event, space),
				pointerup: (event, space) => this.#pointer('up', event, space),
				pointercancel: (event, space) =>
					this.#pointer('cancel', event, space),
				keydown: (event, space) => this.#key('down', event, space),
				keyup: (event, space) => this.#key('up', event, space),
				blur: () => this.#keys.clear(),
				touchend: (event) => {
					const now = Date.now();
					if (now - this.#lastTouch < 300) event.preventDefault();
					this.#lastTouch = now;
				},
			};
			this.on();
		}

		get #inputs() {
			return [
				...Object.values(this.tap),
				...Object.values(this.swipe),
				...Object.values(this.scale),
			];
		}

		#input(type, axis, keys = {}, minus, plus) {
			return Object.assign(
				(minus, plus) => {
					const space = this.universe.space;
					const bindings = this.#bindings.get(space) ?? {};
					(bindings[type] ??= {})[axis] = { minus, plus };
					this.#bindings.set(space, bindings);
					return this;
				},
				{ type, axis, keys, minus, plus },
			);
		}

		clear(space) {
			this.#bindings.delete(space);
		}

		on() {
			this.off();
			this.#controller = new AbortController();
			const { signal } = this.#controller;
			const measure = () =>
				(this.rect = this.universe.el.getBoundingClientRect());
			measure();
			this.#observer = new ResizeObserver(measure);
			this.#observer.observe(this.universe.el);
			for (const space of this.universe.spaces) {
				if (!space.el.hasAttribute('tabindex')) space.el.tabIndex = -1;
				for (const [type, handler] of Object.entries(this.events))
					space.el.addEventListener(
						type,
						(event) => handler(event, space),
						{
							signal,
							passive: type === 'touchend' ? false : undefined,
						},
					);
			}
			return this;
		}

		off() {
			this.#controller?.abort();
			this.#observer?.disconnect();
			this.#controller = this.#observer = undefined;
			this.#pointers.clear();
			this.#keys.clear();
			return this;
		}

		#key(phase, event, space) {
			const key = event.key.toLowerCase();
			if (phase === 'up') return void this.#keys.delete(key);
			if (this.#keys.has(key)) return;
			const input = this.#inputs.find(({ keys }) => keys[key]);
			if (input) {
				this.#keys.add(key);
				this.#emit(input.type, input.axis, input.keys[key], space);
			}
		}

		#pointer(phase, event, space) {
			if (phase === 'down') {
				if (
					this.#pointers.has(event.pointerId) ||
					this.#pointers.size === 2
				)
					return;
				const point = this.#point(event);
				this.#pointers.set(event.pointerId, {
					start: point,
					point,
					space,
				});
				this.universe.space = space;
				space.el.focus({ preventScroll: true });
				space.el.setPointerCapture(event.pointerId);
				return;
			}
			const pointer = this.#pointers.get(event.pointerId);
			if (!pointer) return;
			for (const point of this.#points(event)) {
				pointer.point = point;
				if (phase === 'move' && this.#pointers.size === 2)
					this.#scale();
			}
			if (phase === 'up' && this.#pointers.size === 1)
				this.#gesture(pointer);
			if (phase === 'up' || phase === 'cancel') this.#pointers.clear();
		}

		#gesture(pointer) {
			const movement = this.#movement(
				pointer.point.x - pointer.start.x,
				pointer.point.y - pointer.start.y,
			);
			if (movement.distance < this.delta) {
				const { axis, direction } = this.#movement(
					pointer.point.x,
					pointer.point.y,
				);
				this.#emit('tap', axis, direction, pointer.space);
			} else {
				this.#emit(
					'swipe',
					movement.axis,
					movement.direction,
					pointer.space,
				);
			}
		}

		#scale() {
			const [first, second] = this.#pointers.values();
			const scale = this.#movement(
				Math.abs(second.point.x - first.point.x) -
					Math.abs(second.start.x - first.start.x),
				Math.abs(second.point.y - first.point.y) -
					Math.abs(second.start.y - first.start.y),
			);
			if (scale.distance < this.delta) return;
			this.#emit('scale', scale.axis, scale.direction, first.space);
			first.start = first.point;
			second.start = second.point;
		}

		#emit(type, axis, direction, space) {
			const input = this[type][axis];
			(
				input[direction] ??
				this.#bindings.get(space)?.[type]?.[axis]?.[direction]
			)?.(space);
		}

		#movement(x, y) {
			const axis = Math.abs(y) > Math.abs(x) ? 'y' : 'x';
			return {
				distance: Math.hypot(x, y),
				axis,
				direction: (axis === 'y' ? y : x) < 0 ? 'minus' : 'plus',
			};
		}

		#points(event) {
			const events = event.getCoalescedEvents?.() ?? [];
			return (events.length ? events : [event]).map((current) =>
				this.#point(current),
			);
		}

		#point(event) {
			const { left, top, width, height } = this.rect;
			return {
				x: (2 * (event.clientX - left)) / (width || 1) - 1,
				y: 1 - (2 * (event.clientY - top)) / (height || 1),
			};
		}
	}
</script>
