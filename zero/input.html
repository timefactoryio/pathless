<script>
	class Input {
		#state = null;
		#triggers = new WeakMap();
		#clicks = new WeakMap();

		constructor() {
			this.setTrigger(() => pathless.layout(0), ['1']);
			this.setTrigger(() => pathless.layout(1), ['2']);
			this.setTrigger(() => pathless.layout(2), ['3']);
			this.setTrigger(() => pathless.focus(1), ['tab']);
			this.setTrigger(
				(start, end, space) => pathless.navigate(-1, space),
				['q'],
				['swipe left'],
			);
			this.setTrigger(
				(start, end, space) => pathless.navigate(1, space),
				['e'],
				['swipe right'],
			);
			this.setTrigger(() => pathless.panel(), ['z'], ['origin']);
			for (const [type, handler] of [
				['click', this.click],
				['pointerdown', this.down],
				['pointerup', this.up],
				['pointercancel', this.up],
				['lostpointercapture', this.up],
			]) {
				pathless.el.addEventListener(type, handler.bind(this));
			}
			document.addEventListener('keydown', this.keydown.bind(this));
			pathless.click = (el, callback) => {
				this.#clicks.set(el, callback);
				return pathless;
			};
			pathless.x = this.x.bind(this);
			pathless.y = this.y.bind(this);
		}

		setTrigger(callback, keys = [], gestures = []) {
			const el = pathless.frame?.().el ?? pathless.el;
			let triggers = this.#triggers.get(el);
			if (!triggers) {
				triggers = { keys: new Map(), gestures: new Map() };
				this.#triggers.set(el, triggers);
			}
			for (const key of keys)
				triggers.keys.set(key.toLowerCase(), callback);
			for (const gesture of gestures)
				triggers.gestures.set(gesture, callback);
			return pathless;
		}

		x(left, right) {
			this.setTrigger(left, ['a'], ['-x']);
			return this.setTrigger(right, ['d'], ['x']);
		}

		y(up, down) {
			this.setTrigger(up, ['w'], ['-y']);
			return this.setTrigger(down, ['s'], ['y']);
		}

		down(event) {
			if (!event.isPrimary || event.button !== 0 || this.#state) return;
			const space = pathless.spaces.find(
				(space) => !space.hidden && space.contains(event.target),
			);
			if (!space) return;
			pathless.focus(0, space);
			if (this.#button(event.target)) return;
			pathless.el.setPointerCapture(event.pointerId);
			this.#state = {
				id: event.pointerId,
				start: this.#coordinate(event),
				space,
			};
		}

		up(event) {
			const pointer = this.#state;
			if (!pointer || pointer.id !== event.pointerId) return;
			this.#state = null;
			const { start, space } = pointer;
			if (
				event.type !== 'pointerup' ||
				event.defaultPrevented ||
				space.hidden
			)
				return;
			const end = this.#coordinate(event);
			const deltaX = Math.abs(end[0] - start[0]);
			const deltaY = Math.abs(end[1] - start[1]);
			let gesture;
			if (Math.max(deltaX, deltaY) >= 0.1) {
				if (deltaX < deltaY) return;
				gesture = end[0] < start[0] ? 'swipe left' : 'swipe right';
			} else if (
				[...start, ...end].every((value) => Math.abs(value) <= 0.05)
			) {
				gesture = 'origin';
			} else {
				const offsetX = end[0] - space.origin.x;
				const offsetY = end[1] - space.origin.y;
				gesture =
					Math.abs(offsetX) >= Math.abs(offsetY)
						? offsetX < 0
							? '-x'
							: 'x'
						: offsetY < 0
							? 'y'
							: '-y';
			}
			this.#callback('gestures', gesture, space)?.(start, end, space);
		}

		click(event) {
			if (event.defaultPrevented) return;
			const el = this.#button(event.target);
			if (el) this.#clicks.get(el).call(el, event);
		}

		keydown(event) {
			if (
				event.defaultPrevented ||
				event.isComposing ||
				event.ctrlKey ||
				event.metaKey ||
				event.altKey ||
				event.target.isContentEditable ||
				event.target.closest?.('input, textarea, select')
			)
				return;
			const space = pathless.frame().el?.parentElement;
			const callback = this.#callback(
				'keys',
				event.key.toLowerCase(),
				space,
			);
			if (!callback) return;
			event.preventDefault();
			callback(undefined, undefined, space);
		}

		#callback(type, trigger, space) {
			const el = space?.hidden ? null : space?.firstElementChild;
			return (
				this.#triggers.get(el)?.[type].get(trigger) ??
				this.#triggers.get(pathless.el)?.[type].get(trigger)
			);
		}

		#button(el) {
			while (el && el !== pathless.el) {
				if (this.#clicks.has(el)) return el;
				el = el.parentElement;
			}
		}

		#coordinate({ clientX, clientY }) {
			const { width, height } = pathless.el;
			return [
				Math.max(-1, Math.min(1, (2 * clientX) / width - 1)),
				Math.max(-1, Math.min(1, 1 - (2 * clientY) / height)),
			];
		}
	}
	const input = new Input();
</script>
