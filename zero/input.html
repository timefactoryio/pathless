<script>
	class Input {
		constructor(universe) {
			this.universe = universe;
			const emit = this.handle.bind(this);
			new Keyboard(universe, emit);
			new Pointer(universe, emit);
		}

		handle({ action, value, space }) {
			if (!action) return;
			if (action === 'layout') return this.universe.layout(value);
			if (action === 'focus') return this.universe.focus();
			if (action === 'backward') this.universe.navigate(-1);
			if (action === 'forward') this.universe.navigate(1);
			space.bindings[action]?.();
		}

		#bind(bindings) {
			Object.assign(this.universe.space.bindings, bindings);
			return this;
		}

		x(left, right) {
			return this.#bind({ left, right });
		}

		y(up, down) {
			return this.#bind({ up, down });
		}

		z(backward, forward) {
			return this.#bind({ backward, forward });
		}

		clear(space = this.universe.space) {
			space.bindings = {};
		}
	}

	class Keyboard {
		constructor(universe, emit) {
			const actions = {
				1: ['layout', 0],
				2: ['layout', 1],
				3: ['layout', 2],
				tab: ['focus'],
				a: ['left'],
				d: ['right'],
				w: ['up'],
				s: ['down'],
				q: ['backward'],
				e: ['forward'],
			};
			window.addEventListener('keydown', (event) => {
				const [action, value] = actions[event.key.toLowerCase()] ?? [];
				if (action === 'focus') event.preventDefault();
				emit({ action, value, space: universe.space });
			});
		}
	}

	class Pointer {
		#active = new Map();
		#baseline;

		constructor(universe, emit) {
			this.emit = emit;
			this.threshold = 0.25;
			const handle = (event) => {
				const type = event.type.slice(7);
				const point =
					type === 'cancel' ? undefined : universe.coordinate(event);
				if (type === 'down') {
					const el = event.target.closest?.('.space');
					const space = universe.spaces.find(
						(current) => current.el === el,
					);
					this.#start(event, point, space);
				} else if (type === 'move') this.#move(event, point);
				else this.#end(event, point);
			};
			for (const type of [
				'pointerdown',
				'pointermove',
				'pointerup',
				'pointercancel',
			])
				universe.el.addEventListener(type, handle);
		}

		#delta(from, to) {
			return { x: to.x - from.x, y: to.y - from.y };
		}

		#gap() {
			const [first, second] = this.#active.values();
			return {
				x: Math.abs(second.current.x - first.current.x),
				y: Math.abs(second.current.y - first.current.y),
			};
		}

		#direction({ x, y }) {
			if (Math.abs(x) >= Math.abs(y)) return x < 0 ? 'left' : 'right';
			return y < 0 ? 'down' : 'up';
		}

		#start(event, point, space) {
			if (
				!space ||
				this.#active.has(event.pointerId) ||
				this.#active.size === 2
			)
				return;
			this.#active.set(event.pointerId, {
				space,
				start: point,
				current: point,
			});
			event.currentTarget.setPointerCapture(event.pointerId);
			if (this.#active.size === 2) this.#baseline = this.#gap();
		}

		#move(event, point) {
			const pointer = this.#active.get(event.pointerId);
			if (!pointer) return;
			pointer.current = point;
			if (this.#active.size < 2) return;

			const current = this.#gap();
			const change = this.#delta(this.#baseline, current);
			const direction = this.#direction(change);
			const axis = Math.abs(change.x) >= Math.abs(change.y) ? 'x' : 'y';
			const steps = Math.trunc(change[axis] / this.threshold);
			const space = this.#active.values().next().value.space;
			for (let count = Math.abs(steps); count; count--)
				this.emit({ action: 'scale', value: direction, space });
			this.#baseline[axis] += steps * this.threshold;
		}

		#end(event, point) {
			const pointer = this.#active.get(event.pointerId);
			if (!pointer) return;
			if (point) this.#move(event, point);

			if (this.#active.size === 2) {
				this.#active.clear();
				this.#baseline = undefined;
				return;
			}

			if (point) {
				const movement = this.#delta(pointer.start, pointer.current);
				const tap = Math.hypot(movement.x, movement.y) < this.threshold;
				const direction = this.#direction(
					tap ? pointer.current : movement,
				);
				const action = tap
					? direction
					: { left: 'backward', right: 'forward' }[direction];
				this.emit({ action, space: pointer.space });
			}
			this.#active.delete(event.pointerId);
		}
	}
</script>
